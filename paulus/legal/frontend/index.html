<script>
  /* Antes de qualquer pintura: decidir o tema aqui evita o lampejo branco na
     abertura, que aconteceria se isso rodasse com o resto do script no fim
     do body. */
  (function () {
    /* O escuro e o padrao (pedido do dono, 29/09/2026); o claro e o mesmo
       conjunto de nomes com outros valores (docs/ui/00-fundamentos.md). A
       escolha da pessoa continua valendo e vence sempre. */
    var tema = "escuro";
    try {
      var guardado = localStorage.getItem("paulus.tema");
      if (guardado === "claro" || guardado === "escuro") tema = guardado;
      else if (guardado === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) tema = "escuro";
    } catch (e) { /* sem memoria do navegador, fica no escuro mesmo */ }
    document.documentElement.dataset.tema = tema;

    /* A primeira abertura: o assistente de configuracao so se desenha depois
       de ler as preferencias e a assinatura. Ate la, o fundo dele cobre a
       janela, para a tela de baixo nao piscar antes (23-boas-vindas.js tira). */
    try {
      if (localStorage.getItem("paulus.boasvindas") !== "1") document.documentElement.classList.add("bv-cedo");
    } catch (e) { /* sem memoria do navegador: o assistente decide sozinho */ }

    /* Animacoes reduzidas, pela mesma razao: a primeira pintura ja tem de
       vir parada para quem pediu tela parada. As preferencias confirmam
       depois, quando o servidor responde. */
    try {
      if (localStorage.getItem("paulus.animacoes") === "reduzidas") {
        document.documentElement.classList.add("sem-animacao");
      }
    } catch (e) { /* sem memoria do navegador */ }
  })();
</script>

                <button class="pilula pilula-anexar" id="anexar" title="Anexar documentos (PDF, DOCX, TXT) — ou digite / para escolher um já aberto"><span class="ic ic-18">attach_file</span><span class="rotulo-botao">Anexar</span></button>

                <button class="pilula pilula-inicio" id="buscar" title="Achar a palavra, sem esperar o assistente"><span class="ic ic-18">search</span><span class="rotulo-botao">Buscar</span></button>
                <button class="pilula pilula-inicio" id="pilula-organizar" title="Varrer uma pasta e organizar o acervo"><span class="ic ic-18">folder</span><span class="rotulo-botao">Organizar</span></button>
                <button class="ditar" id="ditar" title="Ditar — o modelo de voz desta máquina escreve no campo" aria-label="Ditar"><span class="ic ic-18">mic</span></button>
                <button class="enviar" id="enviar" title="Enviar" aria-label="Enviar"><span class="ic ic-18">arrow_upward</span></button>
              </div>
            </div>

            <!-- A resposta escrita na conversa: o texto no lugar da caixa de pedido. -->
            <div class="emc-editor" id="emc-editor" hidden></div>

            <div class="agora" id="agora" hidden>
              <div class="agora-cabeca"><span class="sv-kicker">Acontecendo agora</span></div>
              <div class="agora-cartoes" id="agora-cartoes"></div>
            </div>

            <div class="recentes" id="recentes" hidden></div>
            <input type="file" id="arquivos" multiple accept=".pdf,.docx,.txt,.md" hidden>
          </div>
          <!-- Fora do bloco centralizado de proposito: ela e um cartao com a
               largura do fio, e nao um bloco dentro da caixa de pedido. -->
          <div class="lista-conversas" id="lista-conversas" hidden></div>
          <!-- Os avisos no lugar da lista ("ver N" no resumo). -->
          <div class="av-painel-inicio" id="av-painel" hidden></div>
        </div>
    </div>

    <!-- A COLUNA DA DIREITA, da barra da janela ao pe, e ela troca de papel
         (js/02-lado.js): comeca como o contexto da resposta (380 px) e, quando
         a conversa pede uma ferramenta - formulario, configuracao, documento -,
         desliza ate a largura dela e mostra a ferramenta. Terminou (salvar,
         assinar, cancelar, fechar), volta a ser o contexto. -->
    <aside class="lateral" id="lateral" data-papel="contexto" hidden>
      <div class="lado-arrasto pywebview-drag-region"></div>
      <div class="lado-contexto" id="lado-contexto">
        <!-- O cartao do Foco, quando ha um ciclo andando (Conversa - Foco). -->
        <div class="lado-topo" id="lado-topo" hidden></div>
        <section class="lateral-bloco" id="lat-progresso" hidden>
          <button class="lateral-cabeca" id="lat-progresso-cabeca" aria-expanded="true"><b>Progresso</b><span class="contagem" id="lat-progresso-conta"></span><span class="ic lado-seta">expand_more</span></button>
          <div class="lat-etapas" id="lat-etapas"></div>
        </section>
        <section class="lateral-bloco" id="lat-trechos" hidden>
          <button class="lateral-cabeca" id="lat-trechos-cabeca" aria-expanded="true"><b id="lat-trechos-titulo">Trechos lidos</b><span class="contagem" id="lat-trechos-conta"></span><span class="ic lado-seta">expand_more</span></button>
          <div class="lat-lista" id="lat-trechos-lista"></div>
        </section>
        <!-- C3: o resto de "Sobre esta resposta" (js/54-sobre-a-resposta.js). -->
        <section class="lateral-bloco" id="lat-lidas" hidden>
          <button class="lateral-cabeca" id="lat-lidas-cabeca" aria-expanded="false"><b>Também lidas</b><span class="contagem" id="lat-lidas-conta"></span><span class="ic lado-seta">expand_more</span></button>
          <div class="lat-lista" id="lat-lidas-lista" hidden></div>
        </section>
        <section class="lateral-bloco" id="lat-como" hidden>
          <button class="lateral-cabeca" id="lat-como-cabeca" aria-expanded="true"><b id="lat-como-titulo">Como respondi</b><span class="ic lado-seta">expand_more</span></button>
          <div class="propriedades" id="lat-como-lista"></div>
        </section>
        <section class="lateral-bloco" id="lat-onde" hidden>
          <button class="lateral-cabeca" id="lat-onde-cabeca" aria-expanded="true"><b>Onde procurei</b><span class="ic lado-seta">expand_more</span></button>
          <div class="lat-onde" id="lat-onde-corpo">
            <div class="lat-onde-linha" id="lat-onde-linha"></div>
            <p class="lat-onde-texto" id="lat-onde-texto"></p>
          </div>
        </section>
        <section class="lateral-bloco" id="lat-propriedades">
          <button class="lateral-cabeca" id="lat-propriedades-cabeca" aria-expanded="true"><b>Propriedades</b><span class="ic lado-seta">expand_more</span></button>
          <div class="propriedades">
            <div><span>Modelo</span><span class="etiqueta ok" id="prop-modelo"><i></i><span id="prop-modelo-nome">—</span></span></div>
            <div><span>Motor</span><span class="valor-prop" id="prop-motor">Ollama · 127.0.0.1</span></div>
            <div><span>Pasta</span><span class="valor-prop" id="prop-pasta">—</span></div>
            <div><span>Trechos</span><span class="valor-prop" id="prop-trechos">—</span></div>
          </div>
        </section>
      </div>
      <!-- A ferramenta que a conversa abriu: formulario (420), configuracao
           (460) ou documento (o resto da janela, com a conversa em 560). -->
      <div class="lado-ferramenta" id="lado-ferramenta" hidden></div>
    </aside>

  </section>

</div>

<!-- Os avisos do programa: uma faixa na largura inteira da janela, embaixo
     de tudo. Ela abre empurrando a tela para cima e fecha devolvendo o
     espaco - nunca cobre o que estiver no rodape. -->
<div class="faixa-janela" id="faixa-janela" role="status" aria-live="polite"></div>

<!-- A primeira abertura: cobre o programa inteiro ate a pessoa terminar. -->
<div class="boas-vindas" id="boas-vindas" hidden></div>
