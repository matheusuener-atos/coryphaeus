async function mostrarHabilidades() {
  estado.trabalhoId = null;
  estado.trabalho = null;
  $("conversa-titulo").textContent = "O que eu sei fazer";
  $("apagar").hidden = true;
  desenharAtividade([]);
  carregarTrabalhos();

  const centro = $("centro");
  centro.innerHTML = '<div class="catalogo"><p class="nota">carregando…</p></div>';

  let d;
  try {
    d = await (await fetch("/api/habilidades")).json();
  } catch (err) {
    centro.innerHTML = '<div class="catalogo"><p class="nota">não consegui carregar: ' +
      esc(String(err)) + "</p></div>";
    return;
  }

  $("conversa-meta").textContent = d.contagem.prontas + " de " + d.contagem.total + " prontas";

  let html = '<div class="catalogo"><div class="catalogo-topo">' +
    "<h2>O que eu sei fazer</h2>" +
    "<p>Cada habilidade é uma coisa que o programa faz por inteiro. " +
    "As que ainda não existem estão marcadas — prefiro dizer do que prometer.</p></div>";

  for (const grupo of d.grupos) {
    html += '<div class="hab-grupo"><span class="rotulo">' + esc(grupo.grupo) + "</span>";
    for (const h of grupo.habilidades) {
      const futura = h.estado === "em_breve";
      const classe = futura ? "futura" : (h.utilizavel ? "pronta" : "");

      let linha = "";
      if (futura) linha = "ainda não existe";
      else if (h.faltando.length) linha = "precisa de: " + h.faltando.join(", ");
      else if (h.demora) linha = h.demora;

      const acao = futura
        ? '<span class="hab-futuro">em breve</span>'
        : (h.utilizavel
            ? '<button class="hab-usar" data-acao="' + esc(h.acao) + '">Usar</button>'
            : '<button disabled>Usar</button>');

      html += '<div class="hab ' + classe + '" data-id="' + esc(h.id) + '">' +
        '<span class="hab-marca">' + iconeHab(h.id) + "</span>" +
        '<span class="hab-texto"><div class="hab-nome">' + esc(h.nome) + "</div>" +
        '<div class="hab-resumo">' + esc(h.resumo) + "</div>" +
        (linha ? '<div class="hab-linha' + (h.faltando.length && !futura ? " hab-falta" : "") +
                 '">' + esc(linha) + "</div>" : "") +
        (h.detalhe ? '<div class="hab-detalhe">' + esc(h.detalhe) + "</div>" : "") +
        "</span>" +
        '<span class="hab-acao">' + acao + "</span></div>";
    }
    html += "</div>";
  }

  centro.innerHTML = html + "</div>";
  atualizarPostura();

  centro.querySelectorAll(".hab-usar").forEach((b) => {
    b.onclick = () => usarHabilidade(b.dataset.acao);
  });
  $("fluxo").scrollTop = 0;
}

function usarHabilidade(acao) {
  if (acao === "organizacao") { $("centro").innerHTML = ""; organizarComecar(); return; }
  if (acao === "anexar") { $("nova").click(); $("arquivos").click(); return; }
  $("nova").click();
  if (acao === "busca") $("pedido").placeholder = "Digite a palavra e clique em Buscar…";
  $("pedido").focus();
}

$("ver-habilidades").onclick = mostrarHabilidades;

/* -------------------------------------------------------- organizador */

const org = { raizes: [], tipos: [], docs: [], selecao: new Set(), padroes: [] };

const ETAPAS_ORG = [
  "Escolher onde procurar",
  "Ler e classificar os documentos",
  "Conferir a classificação",
  "Mover para a estrutura nova",
];

function etapasOrg(atual, feitos, total) {
  return ETAPAS_ORG.map((titulo, i) => ({
    titulo: titulo,
    estado: i < atual ? "concluido" : (i === atual ? "executando" : "na_fila"),
    feitos: i === atual ? (feitos || 0) : 0,
    total: i === atual ? (total || 0) : 0,
    detalhe: "",
  }));
}

async function organizarComecar() {
  const r = await fetch("/api/trabalhos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pedido: "Organizar uma pasta", tipo: "organizacao" }),
  });
  const t = await r.json();
  estado.trabalhoId = t.id;
  estado.trabalho = t;
  $("conversa-titulo").textContent = t.titulo;
  $("apagar").hidden = false;
  carregarTrabalhos();

  const o = await (await fetch("/api/organizar/opcoes")).json();
  org.raizes = [];      // nada pre-selecionado: a pessoa escolhe onde procurar
  org.tipos = o.tipos;
  org.padroes = o.padroes;
  org.destino = o.destino_sugerido;
  org.diarios = o.diarios;

  $("centro").innerHTML = "";
  passoOnde();
  atualizarPostura();
}

function cartaoOrg(atual, feitos, total) {
  return '<div id="plano-org">' + cartaoPlano(etapasOrg(atual, feitos, total), atual + 1) + "</div>";
}

function atualizarPlanoOrg(atual, feitos, total) {
  const p = $("plano-org");
  if (p) p.innerHTML = cartaoPlano(etapasOrg(atual, feitos, total), atual + 1);
}

const ICONE_PASTA =
  '<svg class="icone" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.4">' +
  '<path d="M1 3.2a1.2 1.2 0 0 1 1.2-1.2h3.3l1.4 1.6h6a1.2 1.2 0 0 1 1.2 1.2v6.4a1.2 1.2 0 0 1-1.2 1.2H2.2A1.2 1.2 0 0 1 1 11.2z"/></svg>';
const ICONE_DISCO =
  '<svg class="icone" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.4">' +
  '<rect x="1" y="2" width="14" height="9" rx="1.4"/><circle cx="8" cy="6.5" r="2.2"/></svg>';

function passoOnde() {
  const centro = $("centro");
  centro.insertAdjacentHTML("beforeend", cartaoOrg(0));

  const painel = document.createElement("div");
  painel.className = "painel";
  painel.id = "painel-onde";
  painel.innerHTML =
    "<h3>Onde eu procuro</h3>" +
    '<p class="explica">Navegue até a pasta e clique em <strong>Incluir esta pasta</strong>. ' +
    "Vou procurar nela e em tudo o que estiver dentro. Não entro em pastas do Windows " +
    "nem de programas: não há contrato de cliente lá.</p>" +
    '<div class="navegador"><div class="migalhas" id="nav-migalhas"></div>' +
    '<div class="nav-lista" id="nav-lista"></div></div>' +
    '<div class="linha-form" style="margin-top:10px">' +
    '<button class="primario" id="nav-incluir" disabled>Incluir esta pasta</button>' +
    '<span class="num" id="nav-atual"></span></div>' +
    '<div class="escolhidas" id="org-escolhidas"></div>' +
    '<div class="linha-form"><button class="primario" id="org-varrer" disabled>Procurar documentos</button>' +
    '<span class="num" id="org-nota"></span></div>';
  centro.appendChild(painel);

  org.raizes = [];
  navegar("");
  $("nav-incluir").onclick = () => {
    if (!org.navegando) return;
    if (!org.raizes.some((r) => r.toLowerCase() === org.navegando.toLowerCase())) {
      org.raizes.push(org.navegando);
    }
    desenharEscolhidas();
  };
  $("org-varrer").onclick = organizarVarrer;
  desenharEscolhidas();
  rolar();
}

async function navegar(caminho) {
  const lista = $("nav-lista");
  lista.innerHTML = '<div class="nav-vazio">abrindo…</div>';

  let d;
  try {
    d = await (await fetch("/api/pastas?caminho=" + encodeURIComponent(caminho))).json();
  } catch (err) {
    lista.innerHTML = '<div class="nav-vazio">não consegui abrir: ' + esc(String(err)) + "</div>";
    return;
  }

  org.navegando = d.atual;
  $("nav-incluir").disabled = !d.atual;
  $("nav-atual").textContent = d.atual || "escolha uma pasta abaixo";

  // trilha clicável
  let trilha = '<button data-ir="">Este computador</button>';
  for (const m of d.migalhas) {
    trilha += '<span class="sep">›</span><button data-ir="' + esc(m.caminho) + '">' + esc(m.nome) + "</button>";
  }
  $("nav-migalhas").innerHTML = trilha;
  $("nav-migalhas").querySelectorAll("button").forEach((b) => {
    b.onclick = () => navegar(b.dataset.ir);
  });

  let html = "";
  if (d.atalhos.length) {
    html += '<div class="nav-grupo">Começar por</div>' + d.atalhos.map((a) =>
      '<div class="nav-item" data-ir="' + esc(a.caminho) + '">' + ICONE_PASTA +
      "<span>" + esc(a.nome) + '</span><span class="cam">' + esc(a.caminho) + "</span></div>"
    ).join("");
  }
  if (d.unidades.length) {
    html += '<div class="nav-grupo">Unidades</div>' + d.unidades.map((u) =>
      '<div class="nav-item" data-ir="' + esc(u.caminho) + '">' + ICONE_DISCO +
      "<span>" + esc(u.nome) + "</span></div>"
    ).join("");
  }
  if (d.pai) {
    html += '<div class="nav-item" data-ir="' + esc(d.pai) + '">' + ICONE_PASTA +
      "<span>.. voltar</span></div>";
  }
  html += d.pastas.map((p) =>
    '<div class="nav-item" data-ir="' + esc(p.caminho) + '">' + ICONE_PASTA +
    "<span>" + esc(p.nome) + "</span></div>"
  ).join("");

  if (d.erro) html += '<div class="nav-vazio">' + esc(d.erro) + "</div>";
  else if (!html) html = '<div class="nav-vazio">nenhuma subpasta aqui</div>';

  lista.innerHTML = html;
  lista.querySelectorAll(".nav-item").forEach((el) => {
    el.onclick = () => navegar(el.dataset.ir);
  });
}

function desenharEscolhidas() {
  $("org-escolhidas").innerHTML = org.raizes.map((c, i) =>
    '<span class="escolhida">' + esc(c) + '<button data-i="' + i + '" title="tirar">×</button></span>'
  ).join("");
  $("org-escolhidas").querySelectorAll("button").forEach((b) => {
    b.onclick = () => { org.raizes.splice(Number(b.dataset.i), 1); desenharEscolhidas(); };
  });
  $("org-varrer").disabled = org.raizes.length === 0;
  $("org-nota").textContent = org.raizes.length
    ? ""
    : "nenhuma pasta escolhida ainda";
}

async function organizarVarrer() {
  if (!org.raizes.length) return;
  $("org-varrer").disabled = true;
  $("org-nota").textContent = "procurando…";

  try {
    const r = await fetch("/api/organizar/escanear", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ raizes: org.raizes }),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    const d = await r.json();

    if (!d.total) {
      $("org-nota").textContent = "nenhum documento encontrado nessas pastas";
      $("org-varrer").disabled = false;
      return;
    }

    $("painel-onde").remove();
    passoConfirmarLeitura(d);
  } catch (err) {
    $("org-nota").innerHTML = esc("não consegui procurar: " + err);
    $("org-varrer").disabled = false;
  }
}

/* Varrer e barato; ler custa ~20 s por documento. Encadear os dois sem
   perguntar foi o que fez o programa sair lendo o computador inteiro. */
function passoConfirmarLeitura(d) {
  const painel = document.createElement("div");
  painel.className = "painel";
  painel.id = "painel-confirmar";

  let detalhe = d.total + " documento(s) em " + d.pastas_visitadas + " pasta(s)";
  if (d.em_cache) detalhe += " · " + d.em_cache + " já lido(s) antes";
  if (d.sem_permissao) detalhe += " · " + d.sem_permissao + " sem permissão de leitura";
  if (d.grandes) detalhe += " · " + d.grandes + " grandes demais";

  const tempo = d.novos === 0
    ? "Todos já foram lidos antes: sai na hora."
    : "Ler os " + d.novos + " documento(s) novo(s) deve levar de <strong>" +
      formatarMinutos(d.minutos_min) + " a " + formatarMinutos(d.minutos_max) +
      "</strong>. Dá para parar no meio, e o que já foi lido fica guardado.";

  painel.innerHTML =
    "<h3>Encontrei " + d.total + " documento(s)</h3>" +
    '<p class="explica">' + esc(detalhe) + "</p>" +
    '<p class="explica">' + tempo + "</p>" +
    '<div class="linha-form"><button class="primario" id="org-ler">Ler e classificar</button>' +
    '<button id="org-voltar">Escolher outras pastas</button></div>';
  $("centro").appendChild(painel);

  $("org-ler").onclick = () => {
    painel.querySelector(".linha-form").remove();
    organizarClassificar(d.total);
  };
  $("org-voltar").onclick = () => {
    painel.remove();
    const plano = $("plano-org");
    if (plano) plano.remove();
    passoOnde();
  };
  rolar();
}

function formatarMinutos(m) {
  if (m < 1) return "menos de 1 min";
  if (m < 60) return Math.round(m) + " min";
  return (m / 60).toFixed(1).replace(".", ",") + " h";
}

async function organizarClassificar(total) {
  atualizarPlanoOrg(1, 0, total);
  atualizarSelo(true);

  // Ler um acervo grande leva quase uma hora. Desistir tem que estar a um
  // clique, nao a um fechar-a-janela.
  const parar = document.createElement("div");
  parar.className = "linha-form";
  parar.id = "org-parar-linha";
  parar.innerHTML = '<button id="org-parar">Parar a leitura</button>' +
    '<span class="num" id="org-parar-nota"></span>';
  const confirmar = $("painel-confirmar");
  if (confirmar) confirmar.appendChild(parar);

  $("org-parar").onclick = async () => {
    $("org-parar").disabled = true;
    $("org-parar-nota").textContent = "parando depois do documento atual…";
    await fetch("/api/organizar/cancelar", { method: "POST" });
  };

  rolar();
  const inicio = Date.now();
  try {
    const r = await fetch("/api/organizar/classificar", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).detail);

    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let buffer = "";

    while (true) {
      const passo = await leitor.read();
      if (passo.done) break;
      buffer += dec.decode(passo.value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop();

      for (const parte of partes) {
        const mt = parte.match(/^event: (.+)$/m);
        const md = parte.match(/^data: (.*)$/m);
        if (!mt || !md) continue;
        const d = JSON.parse(md[1]);

        if (mt[1] === "progresso") {
          atualizarPlanoOrg(1, d.indice, d.total);
          const c = $("cronometro");
          if (c) {
            const seg = (Date.now() - inicio) / 1000;
            const faltam = d.indice ? (seg / d.indice) * (d.total - d.indice) : 0;
            c.textContent = faltam > 5 ? "~" + Math.ceil(faltam / 60) + " min" : Math.round(seg) + " s";
          }
        } else if (mt[1] === "resultados") {
          org.docs = d.documentos;
          org.selecao = new Set(d.documentos.filter((x) => !x.erro).map((x) => x.arquivo));
          atualizarPlanoOrg(2);
          const linha = $("org-parar-linha");
          if (linha) linha.remove();
          if (d.parado) {
            $("centro").insertAdjacentHTML("beforeend",
              '<div class="painel"><h3>Leitura interrompida</h3><p class="explica" style="margin:0">' +
              "Li " + d.documentos.length + " documento(s) antes de parar. Eles ficam guardados: " +
              "se você mandar ler de novo, continua daqui.</p></div>");
          }
          if (d.documentos.length) passoConferir();
        } else if (mt[1] === "erro") {
          atualizarPlanoOrg(1);
          $("centro").insertAdjacentHTML("beforeend",
            '<div class="aprovacao"><p><strong>Não consegui ler os documentos.</strong> ' +
            esc(d.mensagem) + "</p></div>");
        }
      }
    }
  } catch (err) {
    $("centro").insertAdjacentHTML("beforeend",
      '<div class="aprovacao"><p><strong>Não consegui classificar.</strong> ' + esc(String(err)) + "</p></div>");
  } finally {
    atualizarSelo(false);
    rolar();
  }
}

function passoConferir() {
  const painel = document.createElement("div");
  painel.className = "painel";
  painel.innerHTML =
    "<h3>Confira antes de eu mexer em alguma coisa</h3>" +
    '<p class="explica">Cliente e tipo são o meu palpite: eu não tenho como saber qual das partes ' +
    "é cliente do escritório. Corrija o que estiver errado e desmarque o que não deve entrar. " +
    "Nada saiu do lugar ainda.</p>" +
    '<div class="tabela-caixa"><table><thead><tr>' +
    '<th><input type="checkbox" id="org-todos" checked></th><th>Documento</th>' +
    "<th>Tipo</th><th>Cliente</th><th>Data</th><th>Confiança</th>" +
    '</tr></thead><tbody id="org-corpo"></tbody></table></div>' +
    '<div class="linha-form" style="margin-top:12px"><button class="primario" id="org-ir-estrutura">Escolher a estrutura</button></div>';
  $("centro").appendChild(painel);

  desenharTabelaOrg();
  $("org-todos").onchange = (e) => {
    org.selecao = e.target.checked
      ? new Set(org.docs.filter((d) => !d.erro).map((d) => d.arquivo))
      : new Set();
    desenharTabelaOrg();
  };
  $("org-ir-estrutura").onclick = () => {
    if (!org.selecao.size) return;
    passoEstrutura();
  };
  rolar();
}

function desenharTabelaOrg() {
  $("org-corpo").innerHTML = org.docs.map((d, i) => {
    const marcado = org.selecao.has(d.arquivo);
    const opcoes = org.tipos.map((t) =>
      '<option value="' + t.valor + '"' + (t.valor === d.tipo ? " selected" : "") + ">" + esc(t.rotulo) + "</option>"
    ).join("");
    const erro = d.erro ? '<div class="num">' + esc(d.erro) + "</div>" : "";

    return '<tr class="' + (marcado ? "" : "fora") + '" data-i="' + i + '">' +
      '<td><input type="checkbox" data-a="marcar"' + (marcado ? " checked" : "") + (d.erro ? " disabled" : "") + "></td>" +
      '<td><div class="arq">' + esc(d.nome) + "</div>" + erro + "</td>" +
      '<td><select data-a="tipo">' + opcoes + "</select></td>" +
      '<td><input type="text" data-a="cliente" value="' + esc(d.cliente || "") + '"></td>' +
      '<td class="num">' + (d.data || "—") + "</td>" +
      '<td><span class="selo-conf ' + d.confianca + '">' + d.confianca + "</span></td></tr>";
  }).join("");

  $("org-corpo").querySelectorAll("tr").forEach((tr) => {
    const d = org.docs[Number(tr.dataset.i)];
    tr.querySelector('[data-a="marcar"]').onchange = (e) => {
      if (e.target.checked) org.selecao.add(d.arquivo); else org.selecao.delete(d.arquivo);
      tr.className = e.target.checked ? "" : "fora";
    };
    tr.querySelector('[data-a="tipo"]').onchange = (e) => {
      d.tipo = e.target.value;
      const achado = org.tipos.find((t) => t.valor === e.target.value);
      if (achado) d.tipo_rotulo = achado.rotulo;
    };
    tr.querySelector('[data-a="cliente"]').oninput = (e) => { d.cliente = e.target.value; };
  });
}

function passoEstrutura() {
  const painel = document.createElement("div");
  painel.className = "painel";
  painel.id = "painel-estrutura";
  painel.innerHTML =
    "<h3>Como as pastas ficam</h3>" +
    '<div class="linha-form"><label>Estrutura</label><select id="org-padrao">' +
    org.padroes.map((p) => '<option value="' + esc(p.padrao) + '">' + esc(p.rotulo) + "</option>").join("") +
    "</select></div>" +
    '<div class="linha-form"><label>Pasta de destino</label>' +
    '<input type="text" id="org-destino" value="' + esc(org.destino) + '">' +
    (window.pywebview ? '<button id="org-escolher">Escolher…</button>' : "") + "</div>" +
    '<div class="linha-form"><button class="primario" id="org-ver">Ver o plano</button>' +
    '<span class="num" id="org-nota2"></span></div><div id="org-plano"></div>';
  $("centro").appendChild(painel);

  if (window.pywebview) {
    $("org-escolher").onclick = async () => {
      const p = await window.pywebview.api.escolher_pasta();
      if (p) $("org-destino").value = p;
    };
  }
  $("org-ver").onclick = organizarVerPlano;
  rolar();
}

function corpoPlano() {
  return {
    destino: $("org-destino").value.trim(),
    padrao: $("org-padrao").value,
    apenas: Array.from(org.selecao),
    ajustes: org.docs.filter((d) => org.selecao.has(d.arquivo))
      .map((d) => ({ arquivo: d.arquivo, cliente: d.cliente, tipo: d.tipo })),
  };
}

async function organizarVerPlano() {
  $("org-ver").disabled = true;
  try {
    const r = await fetch("/api/organizar/plano", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpoPlano()),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    const plano = await r.json();

    $("org-plano").innerHTML = '<div class="pastas">' + plano.pastas.map((p) =>
      '<div class="pasta-l"><code>' + esc(p.pasta) + '</code><span class="num">' + p.arquivos + "</span></div>"
    ).join("") + "</div>" +
      (plano.ignorados.length
        ? '<p class="explica" style="margin:8px 0 0">Fora do plano: ' +
          esc(plano.ignorados.map((x) => x.nome).join(", ")) + "</p>"
        : "");
    $("org-nota2").textContent = plano.total + " arquivo(s) em " + plano.pastas.length + " pasta(s)";

    const antigo = $("aprovar-org");
    if (antigo) antigo.remove();

    const cartao = document.createElement("div");
    cartao.id = "aprovar-org";
    cartao.className = "aprovacao";
    cartao.innerHTML =
      "<p>Vou mover <strong>" + plano.total + " arquivo(s)</strong> para <strong>" +
      plano.pastas.length + " pasta(s)</strong> em " + esc(plano.destino) +
      ". Nada é apagado nem sobrescrito, e dá para desfazer tudo depois. Posso?</p>" +
      '<div class="acoes"><button class="aprovar-secundario" id="org-revisar">Revisar</button>' +
      '<button class="primario" id="org-aprovar">Aprovar</button></div>';
    $("centro").appendChild(cartao);

    $("org-revisar").onclick = () => {
      cartao.remove();
      $("painel-estrutura").scrollIntoView({ behavior: "smooth", block: "center" });
    };
    $("org-aprovar").onclick = organizarAplicar;
  } catch (err) {
    $("org-nota2").textContent = "não consegui montar o plano: " + err;
  } finally {
    $("org-ver").disabled = false;
    rolar();
  }
}

async function organizarAplicar() {
  const cartao = $("aprovar-org");
  cartao.innerHTML = '<p style="display:flex;align-items:center;gap:9px">' + coroa(17) + " Movendo…</p>";
  atualizarPlanoOrg(3);
  atualizarSelo(true);

  try {
    const r = await fetch("/api/organizar/aplicar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpoPlano()),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    const d = await r.json();

    cartao.className = "painel";
    cartao.innerHTML = "<h3>" + d.movidos + " arquivo(s) no lugar novo</h3>" +
      (d.falhas.length ? '<p class="explica">' + d.falhas.length + " não deu para mover: " +
        esc(d.falhas.map((f) => f.nome).join(", ")) + "</p>" : "") +
      '<div class="linha-form" style="margin:10px 0 0"><button id="org-desfazer">Desfazer tudo</button>' +
      '<span class="num" id="org-nota3">dá para voltar ao estado anterior</span></div>';

    $("plano-org").innerHTML = cartaoPlano(etapasOrg(4), 4);
    $("org-desfazer").onclick = async () => {
      if (!confirm("Devolver os " + d.movidos + " arquivos para onde estavam?")) return;
      $("org-desfazer").disabled = true;
      $("org-nota3").textContent = "devolvendo…";
      try {
        const rr = await fetch("/api/organizar/desfazer", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ diario: d.diario }),
        });
        const dd = await rr.json();
        $("org-nota3").textContent = dd.revertidos + " arquivo(s) de volta ao lugar de origem";
      } catch (err) {
        $("org-desfazer").disabled = false;
        $("org-nota3").textContent = "não consegui desfazer: " + err;
      }
    };
    estado.contratos = 0;
    carregarStatus();
  } catch (err) {
    cartao.innerHTML = "<p><strong>Não consegui mover.</strong> " + esc(String(err)) + "</p>";
  } finally {
    atualizarSelo(false);
    carregarTrabalhos();
    rolar();
  }
}

/* ------------------------------------------------------------- inicio */

atualizarSelo(false);
carregarTrabalhos();
carregarStatus().then(atualizarPostura);
carregarModelo();
carregarRecursos();
$("nova").click();
setInterval(carregarRecursos, 4000);
</script>
