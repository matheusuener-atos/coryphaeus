<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAULUS</title>
<link rel="stylesheet" href="/fontes.css">
<script>
  /* Antes de qualquer pintura: decidir o tema aqui evita o lampejo branco na
     abertura, que aconteceria se isso rodasse com o resto do script no fim
     do body. */
  (function () {
    var tema = "claro";
    try {
      var guardado = localStorage.getItem("paulus.tema");
      if (guardado === "claro" || guardado === "escuro") tema = guardado;
      else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) tema = "escuro";
    } catch (e) {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) tema = "escuro";
    }
    document.documentElement.dataset.tema = tema;
  })();
</script>
<style>
  /*
    Um tema e um conjunto de tokens. Os papeis do manual valem nos dois: azul
    e o unico acento de sistema, ambar significa so "precisa de voce", verde
    so "esta tudo certo".

    --forte existe porque em varios lugares a cor do texto e usada como FUNDO
    (botao primario, bolha da pessoa, chave do interruptor). Escrever
    var(--ink) ali funciona no claro e inverte errado no escuro: botao claro
    com texto branco some.
  */
  :root {
    --ink: #14181c;
    --ink-2: #3c444d;
    --ink-3: #5b6470;
    --ink-muted: #8b95a1;
    --accent: #2f6ba3;
    --accent-soft: #eaf1f8;
    --accent-line: #cfe0ef;
    --attention: #a8680c;
    --attention-soft: #fffaf1;
    --attention-line: #f0dfc2;
    --attention-ink: #7a5406;
    --ok: #1f7a4d;
    --line: #e4e7ec;
    --line-strong: #d9dee5;
    --surface-1: #ffffff;
    --surface-2: #fbfcfd;
    --surface-3: #f7f8fa;
    --track: #eef1f4;

    --forte: #14181c;              /* fundo de botao primario e bolha */
    --forte-texto: #ffffff;
    --forte-hover: #262c33;
    --marcador: #dfe4ea;           /* contorno de etapa pendente */
    --ponto-frio: #c9d1da;         /* ponto de estado sem destaque */
    --placeholder: #9aa3ae;
    --ok-soft: #e9f3ee;
    --alerta-soft: #fbeee6;
    --secundario-linha: #e2d6bd;   /* borda do botao Revisar */

    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
  }

  [data-tema="escuro"] {
    --ink: #e9ecef;
    --ink-2: #b9c1cb;
    --ink-3: #98a2ad;
    --ink-muted: #7f8a97;
    --accent: #77aade;
    --accent-soft: #16283a;
    --accent-line: #2c4a68;
    --attention: #dca354;
    --attention-soft: #2a2114;
    --attention-line: #4c3b1e;
    --attention-ink: #e3b877;
    --ok: #58b98a;
    --line: #262b32;
    --line-strong: #363d46;
    --surface-1: #14171b;
    --surface-2: #101317;
    --surface-3: #0d0f12;
    --track: #23282f;

    --forte: #e9ecef;
    --forte-texto: #14171b;
    --forte-hover: #ffffff;
    --marcador: #3a424c;
    --ponto-frio: #4a535e;
    --placeholder: #6d7783;
    --ok-soft: #16281f;
    --alerta-soft: #2c1d16;
    --secundario-linha: #4c3b1e;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 400 14.5px/1.55 var(--sans);
    color: var(--ink);
    background: var(--surface-1);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { text-wrap: pretty; }

  .rotulo {
    font: 500 10px var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .num { font: 400 10.5px var(--mono); color: var(--ink-3); }
  .corta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ------------------------------------------------------ barra de janela */

  .barra {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    background: var(--surface-3);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .produto { font: 600 13.5px var(--sans); letter-spacing: -0.1px; }

  .selo {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border-radius: 20px;
    padding: 3px 9px;
    border: 1px solid var(--accent-line);
    background: var(--accent-soft);
    font: 500 11px var(--sans);
    color: var(--accent);
  }
  .selo.frio { border-color: var(--line-strong); background: var(--surface-1); color: var(--ink-3); }
  .ponto { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .selo.frio .ponto { display: none; }

  /* --------------------------------------------------------------- grade */

  .corpo { flex: 1; display: flex; min-height: 0; }

  .trabalhos {
    width: 230px;
    flex-shrink: 0;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .conversa-col { flex: 1; min-width: 460px; display: flex; flex-direction: column; min-height: 0; }
  .lateral {
    width: 272px;
    flex-shrink: 0;
    background: var(--surface-2);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ------------------------------------------------- coluna de trabalhos */

  /* Coluna recolhida: so os tres comecos (nova, biblioteca, habilidades).
     A lista de trabalhos some junto - meio nome truncado num trilho de 52 px
     nao ajuda ninguem a reconhecer a conversa. */
  .trabalhos.recolhida { width: 52px; }
  .trabalhos.recolhida .trabalhos-topo { padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .trabalhos.recolhida .lista-trabalhos,
  .trabalhos.recolhida .modelo .nome,
  .trabalhos.recolhida .modelo .num { display: none; }
  .trabalhos.recolhida .modelo { justify-content: center; padding: 12px 0; }
  .trabalhos.recolhida .trabalhos-topo button {
    width: 32px; height: 32px; padding: 0; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 0 !important; font-size: 0;
  }
  .trabalhos.recolhida .trabalhos-topo button::before {
    font: 500 13px var(--mono); letter-spacing: 0;
  }
  .trabalhos.recolhida #nova::before { content: "+"; font-size: 17px; }
  .trabalhos.recolhida #ver-biblioteca::before { content: "B"; }
  .trabalhos.recolhida #ver-habilidades::before { content: "H"; }

  .recolher {
    width: 26px; height: 26px; padding: 0; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    border-color: transparent; background: none; color: var(--ink-3);
  }
  .recolher:hover { background: var(--surface-1); border-color: var(--line-strong); }
  .recolher svg { width: 15px; height: 15px; }

  .trabalhos-topo { padding: 14px 12px 10px; }
  .lista-trabalhos { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .grupo { padding: 14px 4px 6px; }

  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--ink-2);
  }
  .item:hover { background: var(--surface-3); }
  .item.ativo { background: var(--surface-3); color: var(--ink); font-weight: 500; }
  .item .titulo { flex: 1; min-width: 0; }
  .item .marca { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ponto-frio); }
  .item .marca.executando { background: var(--accent); }
  .item .marca.aguardando { background: var(--attention); }
  .item .marca.concluido { background: var(--ok); }
  .item .marca.pausado { background: var(--ponto-frio); }
  .vazio-lista { padding: 10px 8px; font-size: 12.5px; color: var(--ink-muted); }

  .modelo {
    border-top: 1px solid var(--line);
    padding: 12px;
    display: flex;
    gap: 9px;
    align-items: center;
  }
  .modelo .quadro {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--surface-3); border: 1px solid var(--line-strong); flex-shrink: 0;
  }
  .modelo .nome { font-size: 12.5px; font-weight: 500; }

  /* ---------------------------------------------------------- conversa */

  .conversa-topo {
    padding: 13px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .conversa-topo h2 { font: 600 15px var(--sans); }
  .conversa-topo .meta { font: 400 10.5px var(--mono); color: var(--ink-3); margin-top: 2px; }

  .fluxo { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .centro { width: 100%; max-width: 660px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .bolha-pessoa {
    align-self: flex-end;
    max-width: 78%;
    background: var(--forte);
    color: var(--forte-texto);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .resposta { font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
  .resposta .assinatura { font: 400 10.5px var(--mono); color: var(--ink-3); margin-top: 8px; }

  /* cartao */
  .cartao {
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: var(--surface-1);
    overflow: hidden;
  }
  .cartao-topo {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .cartao-topo .quem { font: 500 13px var(--sans); flex: 1; }
  .cartao-corpo { padding: 12px 14px; }

  /* etapas */
  .etapa { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13.5px; }
  .etapa .marcador {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--marcador); background: var(--surface-1);
  }
  .etapa.executando .marcador { border-color: var(--accent); }
  .etapa.concluido .marcador { border-color: var(--accent-line); background: var(--accent-soft); }
  .etapa.falhou .marcador { border-color: var(--attention-line); background: var(--attention-soft); }
  .etapa .texto { flex: 1; min-width: 0; }
  .etapa.na_fila .texto { color: var(--ink-muted); }
  .etapa .estado { font: 400 10.5px var(--mono); color: var(--ink-3); }

  .progresso { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin: 2px 0 6px 26px; }
  .progresso i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }

  /* cartao de aprovacao */
  .aprovacao {
    background: var(--attention-soft);
    border: 1px solid var(--attention-line);
    border-radius: 12px;
    padding: 14px;
  }
  .aprovacao p { margin: 0 0 12px; font-size: 13.5px; }
  .aprovacao .acoes { display: flex; gap: 8px; }

  /* fontes citadas */
  .fontes { margin-top: 10px; }
  .fontes summary {
    cursor: pointer; list-style: none;
    font-size: 12.5px; color: var(--accent); padding: 4px 0;
  }
  .fontes summary::-webkit-details-marker { display: none; }
  .trecho {
    border: 1px solid var(--line);
    border-left: 2px solid var(--accent-line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 7px;
    font-size: 12.5px;
    background: var(--surface-2);
  }
  .trecho .origem { font: 500 11px var(--mono); color: var(--accent); margin-bottom: 4px; }
  .trecho pre { margin: 0; font: inherit; white-space: pre-wrap; color: var(--ink-2); max-height: 170px; overflow-y: auto; }

  .aviso-cobertura {
    background: var(--attention-soft);
    border: 1px solid var(--attention-line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 10px;
  }

  /* ------------------------------------------------------- compositor */
  /*
    Duas posturas, a mesma peca. Sem conversa comecada, a chamada e o cartao
    ficam no meio da coluna: a tela pergunta antes de pedir. Com conversa
    andando, o cartao desce e encosta embaixo, porque ali o que importa e a
    resposta acima dele.
  */
  .compositor {
    border-top: 1px solid var(--line);
    padding: 14px 20px 12px;
    flex-shrink: 0;
    background: var(--surface-1);
  }

  .conversa-col.vazia .fluxo { flex: 0 0 auto; padding-bottom: 0; }
  .conversa-col.vazia { justify-content: center; }
  .conversa-col.vazia .compositor { border-top: none; padding-bottom: 30px; }
  .conversa-col.vazia .chamada { display: block; }
  .conversa-col.vazia .exemplos-rapidos { display: flex; }
  .conversa-col.vazia .rodape-vazio { display: block; }

  .chamada {
    display: none;
    font: 600 27px/1.25 var(--sans);
    letter-spacing: -0.4px;
    text-align: center;
    margin-bottom: 20px;
  }

  .cartao-campo {
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    background: var(--surface-1);
    padding: 12px 12px 10px;
    box-shadow: 0 2px 6px rgba(20, 24, 28, 0.05);
  }
  .cartao-campo:focus-within { border-color: var(--accent); }
  [data-tema="escuro"] .cartao-campo { box-shadow: none; background: var(--surface-2); }

  textarea {
    display: block; width: 100%;
    font: 400 14.5px/1.55 var(--sans); resize: none;
    border: none; background: none; outline: none;
    padding: 3px 4px 8px; max-height: 190px; color: inherit;
  }
  textarea::placeholder { color: var(--placeholder); }

  .pilulas { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .pilula {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); border-radius: 16px;
    padding: 5px 12px; font: 400 12.5px var(--sans);
    background: var(--surface-1); color: var(--ink-2); cursor: pointer;
  }
  .pilula:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pilula svg { width: 13px; height: 13px; flex-shrink: 0; }
  [data-tema="escuro"] .pilula { background: var(--surface-1); }

  .enviar {
    margin-left: auto;
    width: 34px; height: 34px; flex-shrink: 0;
    border-radius: 50%; border: none; padding: 0;
    background: var(--forte); color: var(--forte-texto);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .enviar:hover:not(:disabled) { background: var(--forte-hover); color: var(--forte-texto); }
  .enviar svg { width: 16px; height: 16px; }

  .exemplos-rapidos {
    display: none;
    justify-content: center; flex-wrap: wrap; gap: 7px; margin-top: 14px;
  }

  .privacidade { font-size: 11.5px; color: var(--ink-muted); margin-top: 12px; text-align: center; }

  /* --------------------------------------------------------- botoes */

  button {
    font: 400 13px var(--sans);
    cursor: pointer;
    border-radius: 8px;
    padding: 8px 16px;
    border: 1px solid var(--line-strong);
    background: var(--surface-1);
    color: var(--ink-2);
  }
  button:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primario { background: var(--forte); border-color: var(--forte); color: var(--forte-texto); font-weight: 500; }
  button.primario:hover:not(:disabled) { background: var(--forte-hover); border-color: var(--forte-hover); color: var(--forte-texto); }
  button.aprovar-secundario { background: var(--surface-1); border-color: var(--secundario-linha); color: var(--attention-ink); }
  button.largo { width: 100%; }
  button.pastilha { border-radius: 16px; padding: 5px 12px; font-size: 12px; }

  /* --------------------------------------------------------- lateral */

  .lateral-bloco { padding: 14px; border-bottom: 1px solid var(--line); }
  .lateral-rolagem { flex: 1; overflow-y: auto; }

  .atividade-linha { display: flex; gap: 9px; padding: 6px 0; }
  .atividade-linha .ponto-at {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ponto-frio);
    margin-top: 6px; flex-shrink: 0;
  }
  .atividade-linha:first-child .ponto-at { background: var(--accent); }
  .atividade-linha .txt { font-size: 13px; color: var(--ink-2); }

  .maquina { margin-top: auto; border-top: 1px solid var(--line); padding: 14px; background: var(--surface-2); }
  .frase-maquina { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 10px; }
  .medidor { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .medidor .nome { font-size: 12.5px; color: var(--ink-2); width: 64px; flex-shrink: 0; }
  .medidor .trilho { flex: 1; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .medidor .trilho i { display: block; height: 100%; background: var(--accent); transition: width 0.4s; }
  .medidor .valor { font: 400 10.5px var(--mono); color: var(--ink-3); width: 46px; text-align: right; flex-shrink: 0; }

  .interruptor {
    display: flex; align-items: center; gap: 9px; margin-top: 12px;
    border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 11px;
    background: var(--surface-1); font-size: 12.5px; cursor: pointer;
  }
  .interruptor .chave {
    margin-left: auto; width: 34px; height: 19px; border-radius: 20px;
    background: var(--line-strong); position: relative; transition: background 0.2s; flex-shrink: 0;
  }
  .interruptor .chave::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%; background: var(--surface-1); transition: transform 0.2s;
  }
  .interruptor.on .chave { background: var(--forte); }
  .interruptor.on .chave::after { transform: translateX(15px); }

  /* ------------------------------------------------------ organizador */

  .fluxo.arrastando { background: var(--accent-soft); outline: 2px dashed var(--accent-line); outline-offset: -12px; }

  .painel { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface-1); padding: 14px; }
  .painel h3 { font: 600 13.5px var(--sans); margin-bottom: 4px; }
  .painel .explica { font-size: 12.5px; color: var(--ink-3); margin: 0 0 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-strong); border-radius: 16px;
    padding: 5px 12px; font-size: 12.5px; background: var(--surface-1);
    cursor: pointer; color: var(--ink-2);
  }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip .caminho { font: 400 10.5px var(--mono); opacity: 0.75; }

  .linha-form { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; flex-wrap: wrap; }
  .linha-form label { font-size: 12.5px; color: var(--ink-3); min-width: 108px; }
  input[type=text], select {
    font: 400 13px var(--sans); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 9px 12px; background: var(--surface-1);
    color: inherit; flex: 1; min-width: 200px;
  }
  input[type=text]::placeholder { color: var(--placeholder); }

  .tabela-caixa { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 320px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--surface-2);
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
    font: 500 10px var(--mono); letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-muted); white-space: nowrap;
  }
  tbody td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.fora { opacity: 0.4; }
  td .arq { max-width: 210px; }
  td input[type=text], td select {
    border-color: transparent; background: transparent; padding: 4px 6px;
    border-radius: 6px; min-width: 0; font-size: 12.5px;
  }
  td input[type=text]:hover, td select:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .selo-conf { font: 400 10.5px var(--mono); padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .selo-conf.alta { background: var(--ok-soft); color: var(--ok); }
  .selo-conf.media { background: var(--attention-soft); color: var(--attention-ink); }
  .selo-conf.baixa { background: var(--alerta-soft); color: var(--attention); }

  /* seletor de pastas */
  .navegador { border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .migalhas {
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
    padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
    font: 400 11.5px var(--mono);
  }
  .migalhas button {
    border: none; background: none; padding: 2px 5px; border-radius: 5px;
    font: inherit; color: var(--accent); cursor: pointer;
  }
  .migalhas button:hover { background: var(--accent-soft); color: var(--accent); }
  .migalhas .sep { color: var(--ink-muted); }

  .nav-lista { max-height: 260px; overflow-y: auto; background: var(--surface-1); }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    font-size: 13px; cursor: pointer; color: var(--ink-2);
  }
  .nav-item:last-child { border-bottom: none; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item .icone { width: 15px; height: 13px; flex-shrink: 0; opacity: 0.55; }
  .nav-item .cam { margin-left: auto; font: 400 10.5px var(--mono); color: var(--ink-muted); }
  .nav-grupo {
    padding: 8px 12px 4px; font: 500 10px var(--mono); letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-muted); background: var(--surface-2);
  }
  .nav-vazio { padding: 16px 12px; font-size: 12.5px; color: var(--ink-muted); }

  .escolhidas { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
  .escolhida {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--accent-line); background: var(--accent-soft);
    border-radius: 16px; padding: 5px 8px 5px 12px; font: 400 12px var(--mono); color: var(--accent);
  }
  .escolhida button {
    border: none; background: none; color: var(--accent); cursor: pointer;
    padding: 0 4px; font-size: 14px; line-height: 1; border-radius: 4px;
  }
  .escolhida button:hover { background: var(--accent-line); color: var(--accent); }

  .pastas { border: 1px solid var(--line); border-radius: 10px; max-height: 240px; overflow-y: auto; }
  .pasta-l { display: flex; justify-content: space-between; gap: 12px; padding: 7px 11px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .pasta-l:last-child { border-bottom: none; }
  .pasta-l code { font: 400 11.5px var(--mono); color: var(--ink-2); word-break: break-all; }

  /* ------------------------------------------------------- habilidades */

  .catalogo { width: 100%; max-width: 760px; margin: 0 auto; }
  .catalogo-topo { margin-bottom: 22px; }
  .catalogo-topo h2 { font: 600 19px var(--sans); margin-bottom: 5px; }
  .catalogo-topo p { margin: 0; font-size: 13.5px; color: var(--ink-2); }

  .hab-grupo { margin-bottom: 26px; }
  .hab-grupo > .rotulo { margin-bottom: 10px; display: block; }

  .hab {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--line);
  }
  .hab:last-child { border-bottom: none; }
  .hab-marca {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: var(--surface-3); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3);
  }
  .hab.pronta .hab-marca { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .hab-marca svg { width: 16px; height: 16px; }

  .hab-texto { flex: 1; min-width: 0; }
  .hab-nome { font: 500 14px var(--sans); margin-bottom: 2px; }
  .hab.futura .hab-nome { color: var(--ink-3); }
  .hab-resumo { font-size: 13px; color: var(--ink-2); }
  .hab-linha { font: 400 10.5px var(--mono); color: var(--ink-muted); margin-top: 5px; }
  .hab-falta { color: var(--attention-ink); }

  .hab-acao { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding-top: 2px; }
  .hab-futuro {
    font: 400 11px var(--mono); color: var(--ink-muted);
    border: 1px solid var(--line); border-radius: 16px; padding: 4px 11px;
    white-space: nowrap;
  }

  .hab-detalhe {
    font-size: 12.5px; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; margin-top: 9px;
  }

  /* -------------------------------------------------------- biblioteca */

  .bib-topo { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .bib-topo h2 { font: 600 19px var(--sans); }
  .bib-topo .num { margin-bottom: 3px; }
  .bib-busca { margin-left: auto; min-width: 220px; flex: 0 1 300px; }

  .doc-linha {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
  }
  .doc-linha:last-child { border-bottom: none; }
  .doc-marca {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: var(--surface-3); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font: 500 9.5px var(--mono); color: var(--ink-3); text-transform: uppercase;
  }
  .doc-texto { flex: 1; min-width: 0; }
  .doc-nome { font: 500 13.5px var(--sans); }
  .doc-meta { font: 400 10.5px var(--mono); color: var(--ink-muted); margin-top: 3px; }
  .doc-etiquetas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .etiqueta {
    font: 400 11px var(--sans);
    border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 2px 9px; color: var(--ink-2);
  }
  .etiqueta.tipo { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
  .doc-acoes { display: flex; gap: 7px; flex-shrink: 0; }
  .doc-linha.sumido .doc-nome { color: var(--ink-3); text-decoration: line-through; }

  /* ----------------------------------------------------------- coroa */

  .coroa { flex-shrink: 0; color: var(--accent); animation: girar 9s linear infinite; }
  .coroa.parada { animation: none; opacity: 0.6; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .coroa { animation: none; }
    .progresso i, .medidor .trilho i { transition: none; }
  }

  /* ------------------------------------------------------- responsivo */

  @media (max-width: 1180px) {
    .lateral { display: none; }
    .lateral.aberta {
      display: flex; position: absolute; right: 0; top: 45px; bottom: 0;
      box-shadow: 0 12px 32px rgba(20, 24, 28, 0.10); z-index: 5;
    }
    .botao-gaveta { display: inline-flex; }
  }
  @media (min-width: 1181px) { .botao-gaveta { display: none; } }
  @media (max-width: 900px) {
    .trabalhos { display: none; }
    .conversa-col { min-width: 0; }
  }
</style>
</head>
<body>

<div class="barra">
  <button class="recolher" id="recolher" title="Recolher a coluna" aria-label="Recolher a coluna">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6"/><path d="M6.1 2.6v10.8"/>
    </svg>
  </button>
  <span class="produto">PAULUS</span>
  <span class="selo" id="selo"><span class="ponto"></span><span id="selo-texto">Ocioso</span></span>
  <button class="pastilha" id="tema" title="Alternar claro e escuro" aria-label="Alternar claro e escuro"></button>
  <button class="botao-gaveta pastilha" id="abrir-gaveta">Atividade</button>
</div>

<div class="corpo">

  <aside class="trabalhos">
    <div class="trabalhos-topo">
      <button class="primario largo" id="nova">Nova solicitação</button>
      <button class="largo" id="ver-biblioteca" style="margin-top:7px">Biblioteca</button>
      <button class="largo" id="ver-habilidades" style="margin-top:7px">O que eu sei fazer</button>
    </div>
    <div class="lista-trabalhos" id="lista-trabalhos"></div>
    <div class="modelo">
      <div class="quadro"></div>
      <div style="min-width:0">
        <div class="nome">Assistente local</div>
        <div class="num" id="modelo-tamanho">na sua máquina</div>
      </div>
    </div>
  </aside>

  <section class="conversa-col" id="conversa-col">
    <div class="conversa-topo">
      <div style="flex:1;min-width:0">
        <h2 class="corta" id="conversa-titulo">Nova solicitação</h2>
        <div class="meta" id="conversa-meta">nenhum contrato aberto</div>
      </div>
      <button id="apagar" hidden>Apagar</button>
    </div>

    <div class="fluxo" id="fluxo">
      <div class="centro" id="centro"></div>
    </div>

    <div class="compositor">
      <div class="centro">
        <h1 class="chamada" id="chamada">Em que posso ajudar?</h1>

        <div class="cartao-campo" id="cartao-campo">
          <textarea id="pedido" rows="1" placeholder="Peça o que precisa dos seus documentos…"></textarea>
          <div class="pilulas">
            <button class="pilula" id="anexar" title="Anexar documentos (PDF, DOCX, TXT)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <path d="M13 7.2 8.1 12a3.1 3.1 0 0 1-4.4-4.4l5.2-5.2a2.1 2.1 0 0 1 2.9 3l-5.2 5.2a1 1 0 0 1-1.4-1.4l4.7-4.7"/>
              </svg><span>Anexar</span>
            </button>
            <button class="pilula" id="buscar" title="Achar a palavra, sem esperar o assistente">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3 14 14"/>
              </svg><span>Buscar</span>
            </button>
            <button class="pilula" id="pilula-organizar" title="Varrer uma pasta e organizar o acervo">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                <path d="M1.6 4.2A1.2 1.2 0 0 1 2.8 3h3.1l1.4 1.6h5A1.2 1.2 0 0 1 13.5 5.8v6a1.2 1.2 0 0 1-1.2 1.2H2.8a1.2 1.2 0 0 1-1.2-1.2z"/>
              </svg><span>Organizar</span>
            </button>

            <button class="enviar" id="enviar" title="Perguntar" aria-label="Perguntar">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 13V3.4M4 7l4-3.6L12 7"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="exemplos-rapidos" id="exemplos-rapidos"></div>
        <input type="file" id="arquivos" multiple accept=".pdf,.docx,.txt,.md" hidden>
        <div class="privacidade" id="privacidade">nenhuma requisição à internet nesta sessão</div>
      </div>
    </div>
  </section>

  <aside class="lateral" id="lateral">
    <div class="lateral-rolagem">
      <div class="lateral-bloco" id="bloco-aprovacao" hidden>
        <div class="rotulo" style="margin-bottom:9px">Precisa de você</div>
        <div id="aprovacoes"></div>
      </div>
      <div class="lateral-bloco">
        <div class="rotulo" style="margin-bottom:6px">Atividade</div>
        <div id="atividade"><span class="vazio-lista" style="padding-left:0">nada ainda</span></div>
      </div>
    </div>
    <div class="maquina">
      <div class="rotulo">Seu computador</div>
      <div class="frase-maquina" id="frase-maquina">lendo…</div>
      <div class="medidor">
        <span class="nome">Vídeo</span>
        <span class="trilho"><i id="m-video"></i></span>
        <span class="valor" id="v-video">—</span>
      </div>
      <div class="medidor">
        <span class="nome">Memória</span>
        <span class="trilho"><i id="m-memoria"></i></span>
        <span class="valor" id="v-memoria">—</span>
      </div>
      <div class="medidor">
        <span class="nome">Processador</span>
        <span class="trilho"><i id="m-cpu"></i></span>
        <span class="valor" id="v-cpu">—</span>
      </div>
      <div class="interruptor" id="devagar" role="switch" aria-checked="false" tabindex="0">
        <span>Ir devagar quando eu usar o PC</span>
        <span class="chave"></span>
      </div>
    </div>
  </aside>

</div>

<script>
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------- tema */
/* A escolha ja foi aplicada no <head>; aqui so o rotulo e a troca. */

function aplicarTema(tema) {
  document.documentElement.dataset.tema = tema;
  $("tema").textContent = tema === "escuro" ? "Claro" : "Escuro";
  try { localStorage.setItem("paulus.tema", tema); } catch (err) { /* sem memoria, tudo bem */ }
}

aplicarTema(document.documentElement.dataset.tema || "claro");

$("tema").onclick = () => {
  aplicarTema(document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro");
};

function esc(t) {
  const d = document.createElement("div");
  d.textContent = t == null ? "" : String(t);
  return d.innerHTML;
}

/* A coroa: anel entalhado, nunca um aro liso nem um spinner de biblioteca. */
function coroa(px) {
  const r = 9, circ = 2 * Math.PI * r;
  const traco = circ / 12;
  return '<svg class="coroa" width="' + px + '" height="' + px + '" viewBox="0 0 24 24" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="' + r + '" fill="none" stroke="currentColor" stroke-width="2.6" ' +
    'stroke-dasharray="' + (traco * 0.55).toFixed(2) + ' ' + (traco * 0.45).toFixed(2) + '"/></svg>';
}

const estado = {
  trabalhoId: null,
  trabalho: null,
  ocupado: false,
  contratos: 0,
};

/* ----------------------------------------------------------- trabalhos */

async function carregarTrabalhos() {
  const r = await fetch("/api/trabalhos");
  const d = await r.json();
  const alvo = $("lista-trabalhos");
  let html = "";

  if (d.em_andamento.length) {
    html += '<div class="grupo rotulo">Em andamento</div>' + d.em_andamento.map(linhaTrabalho).join("");
  }
  if (d.recentes.length) {
    html += '<div class="grupo rotulo">Recentes</div>' + d.recentes.map(linhaTrabalho).join("");
  }
  if (!html) html = '<div class="vazio-lista">Nenhuma conversa ainda.</div>';

  alvo.innerHTML = html;
  alvo.querySelectorAll(".item").forEach((el) => {
    el.onclick = () => abrirTrabalho(el.dataset.id);
  });
}

function linhaTrabalho(t) {
  const ativo = t.id === estado.trabalhoId ? " ativo" : "";
  const direita = t.estado === "aguardando"
    ? '<span class="num">' + t.pendencias + "</span>"
    : (t.progresso !== null && t.aberto ? '<span class="num">' + t.progresso + "%</span>" : "");
  return '<div class="item' + ativo + '" data-id="' + t.id + '">' +
    '<span class="marca ' + t.estado + '"></span>' +
    '<span class="titulo corta">' + esc(t.titulo) + "</span>" + direita + "</div>";
}

async function abrirTrabalho(id) {
  const r = await fetch("/api/trabalhos/" + id);
  if (!r.ok) return;
  estado.trabalho = await r.json();
  estado.trabalhoId = id;
  desenharTrabalho();
  carregarTrabalhos();
}

$("nova").onclick = () => {
  estado.trabalhoId = null;
  estado.trabalho = null;
  $("conversa-titulo").textContent = "Nova solicitação";
  $("apagar").hidden = true;
  $("centro").innerHTML = exemplos();
  ligarExemplos();
  desenharAtividade([]);
  carregarTrabalhos();
  atualizarPostura();
  $("pedido").focus();
};

$("apagar").onclick = async () => {
  if (!estado.trabalhoId) return;
  if (!confirm("Apagar esta conversa?")) return;
  await fetch("/api/trabalhos/" + estado.trabalhoId, { method: "DELETE" });
  $("nova").click();
};

function exemplos() {
  return estado.contratos
    ? ""
    : '<div class="painel"><h3>Comece abrindo documentos</h3>' +
      '<p class="explica">Anexe contratos aqui embaixo, ou arraste para esta área. ' +
      "Também dá para eu varrer uma pasta inteira e organizar o acervo.</p></div>";
}

/* A postura do compositor: no meio quando nao ha conversa, embaixo quando ha. */
function atualizarPostura() {
  const temConversa = Boolean(
    estado.trabalhoId ||
    ($("centro") && $("centro").querySelector(".bolha-pessoa, .resposta, .catalogo, .painel, .cartao"))
  );
  $("conversa-col").classList.toggle("vazia", !temConversa);
  if (!temConversa) desenharExemplosRapidos();
}

function desenharExemplosRapidos() {
  const alvo = $("exemplos-rapidos");
  if (!estado.contratos) {
    alvo.innerHTML = "";
    return;
  }
  const pedidos = [
    "Quais são as cláusulas de penalidade?",
    "Qual o prazo de vigência de cada contrato?",
    "Quem são as partes?",
  ];
  alvo.innerHTML = pedidos.map((p) => '<button class="pilula exemplo">' + esc(p) + "</button>").join("");
  ligarExemplos();
}

function ligarExemplos() {
  document.querySelectorAll(".exemplo").forEach((b) => {
    b.onclick = () => { $("pedido").value = b.textContent; enviar(); };
  });
}

$("pilula-organizar").onclick = () => {
  $("centro").innerHTML = "";
  organizarComecar();
};

/* --------------------------------------------------------- recolher */

const RAIL_GUARDADO = "paulus.coluna";

function aplicarColuna(recolhida) {
  document.querySelector(".trabalhos").classList.toggle("recolhida", recolhida);
  $("recolher").title = recolhida ? "Mostrar a coluna" : "Recolher a coluna";
  try { localStorage.setItem(RAIL_GUARDADO, recolhida ? "1" : "0"); } catch (err) { /* sem memoria */ }
}

$("recolher").onclick = () => {
  aplicarColuna(!document.querySelector(".trabalhos").classList.contains("recolhida"));
};

try {
  aplicarColuna(localStorage.getItem(RAIL_GUARDADO) === "1");
} catch (err) {
  aplicarColuna(false);
}

/* ----------------------------------------------------------- anexar */

$("anexar").onclick = () => $("arquivos").click();
$("arquivos").onchange = (e) => {
  const lista = Array.from(e.target.files);
  e.target.value = "";
  if (lista.length) subirArquivos(lista);
};

const fluxo = $("fluxo");
["dragenter", "dragover"].forEach((ev) => fluxo.addEventListener(ev, (e) => {
  e.preventDefault();
  fluxo.classList.add("arrastando");
}));
["dragleave", "drop"].forEach((ev) => fluxo.addEventListener(ev, (e) => {
  e.preventDefault();
  if (ev === "dragleave" && fluxo.contains(e.relatedTarget)) return;
  fluxo.classList.remove("arrastando");
}));
fluxo.addEventListener("drop", (e) => {
  const lista = Array.from(e.dataTransfer.files || []);
  if (lista.length) subirArquivos(lista);
});

async function subirArquivos(lista) {
  const dados = new FormData();
  lista.forEach((a) => dados.append("arquivos", a));

  const nota = document.createElement("div");
  nota.className = "painel";
  nota.innerHTML = '<div style="display:flex;align-items:center;gap:9px">' + coroa(17) +
    "<span>Lendo " + lista.length + " arquivo(s)…</span></div>";
  $("centro").appendChild(nota);
  rolar();

  try {
    const r = await fetch("/api/upload", { method: "POST", body: dados });
    const res = await r.json();

    let texto = res.salvos.length
      ? res.salvos.length + " documento(s) aberto(s). Agora são " + res.contratos + " no total."
      : "Nenhum documento novo foi aberto.";
    if (res.recusados.length) {
      texto += " Não consegui abrir: " +
        res.recusados.map((x) => x.nome + " (" + x.motivo + ")").join(", ") + ".";
    }
    nota.innerHTML = "<div>" + esc(texto) + "</div>";
    estado.contratos = res.contratos;
    carregarStatus();
  } catch (err) {
    nota.innerHTML = '<div>Não consegui abrir os arquivos: ' + esc(String(err)) + "</div>";
  }
  rolar();
}

/* ------------------------------------------------------------ buscar */

$("buscar").onclick = async () => {
  const termo = $("pedido").value.trim();
  if (!termo || estado.ocupado) return;
  $("pedido").value = "";
  $("pedido").style.height = "auto";

  const centro = $("centro");
  if (!estado.trabalhoId) centro.innerHTML = "";
  centro.insertAdjacentHTML("beforeend", bolhaPessoa(termo));
  atualizarPostura();

  const bloco = document.createElement("div");
  bloco.className = "resposta";
  centro.appendChild(bloco);
  rolar();

  try {
    const r = await fetch("/api/buscar-agora", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ termo: termo }),
    });
    const d = await r.json();

    if (!d.resultados.length) {
      bloco.innerHTML = "<div>Não achei essa palavra nos " + d.contratos + " contrato(s) abertos.</div>";
    } else {
      const nomes = new Set(d.resultados.map((x) => x.documento));
      bloco.innerHTML = "<div>" + d.resultados.length + " trecho(s) em " + nomes.size +
        " contrato(s), sem passar pelo assistente.</div>" +
        d.resultados.map((x) =>
          '<div class="trecho"><div class="origem">' + esc(x.documento) + " · trecho " + x.trecho +
          "</div><pre>" + esc(x.texto) + "</pre></div>"
        ).join("");
    }
  } catch (err) {
    bloco.innerHTML = "<div>Não consegui buscar: " + esc(String(err)) + "</div>";
  }
  rolar();
};

/* ------------------------------------------------------------ desenho */

function desenharTrabalho() {
  const t = estado.trabalho;
  $("conversa-titulo").textContent = t.titulo;
  $("apagar").hidden = false;

  let html = "";
  for (const m of t.mensagens) {
    html += m.autor === "pessoa" ? bolhaPessoa(m.texto) : blocoResposta(m);
  }
  if (t.etapas.length && t.estado !== "concluido") html += cartaoPlano(t.etapas, t.etapa_atual);
  if (t.aprovacao) html += cartaoAprovacao(t.aprovacao);

  $("centro").innerHTML = html || exemplos();
  ligarExemplos();
  desenharAtividade(t.atividade);
  atualizarPostura();
  rolar();
}

function bolhaPessoa(texto) {
  return '<div class="bolha-pessoa">' + esc(texto) + "</div>";
}

function blocoResposta(m) {
  let html = '<div class="resposta">';
  if (m.cobertura && m.cobertura.ignorados && m.cobertura.ignorados.length) {
    html += avisoCobertura(m.cobertura);
  }
  html += '<div class="texto">' + esc(m.texto) + "</div>";
  if (m.fontes && m.fontes.length) html += blocoFontes(m.fontes, m.cobertura);
  if (m.segundos) html += '<div class="assinatura">respondido em ' + m.segundos + "s</div>";
  return html + "</div>";
}

function avisoCobertura(c) {
  return '<div class="aviso-cobertura"><strong>Li ' + c.consultados.length + " de " +
    c.total_contratos + " contratos.</strong> Sem trecho sobre isso em: " +
    esc(c.ignorados.join(", ")) + ". A resposta não fala por esses.</div>";
}

function blocoFontes(fontes, cobertura) {
  const quantos = cobertura && cobertura.consultados ? cobertura.consultados.length : 1;
  return '<details class="fontes"><summary>' + fontes.length + " trechos de " + quantos +
    " contrato(s) — ver o que eu li</summary>" +
    fontes.map((f) =>
      '<div class="trecho"><div class="origem">' + esc(f.documento) + " · trecho " + f.trecho +
      "</div><pre>" + esc(f.texto) + "</pre></div>"
    ).join("") + "</details>";
}

function cartaoPlano(etapas, atual) {
  const total = etapas.length;
  const rodando = estado.ocupado;
  return '<div class="cartao"><div class="cartao-topo">' +
    (rodando ? coroa(20) : '<span class="ponto" style="background:#c9d1da"></span>') +
    '<span class="quem">' + (rodando ? "Trabalhando" : "Parado") + " · etapa " + atual + " de " + total + "</span>" +
    '<span class="num" id="cronometro"></span></div><div class="cartao-corpo">' +
    etapas.map(linhaEtapa).join("") + "</div></div>";
}

function linhaEtapa(e) {
  const rotulos = { concluido: "concluído", executando: "", na_fila: "na fila", falhou: "não deu" };
  const direita = e.total
    ? '<span class="estado">' + e.feitos + " / " + e.total + "</span>"
    : '<span class="estado">' + (rotulos[e.estado] || "") + "</span>";
  const barra = e.estado === "executando" && e.total
    ? '<div class="progresso"><i style="width:' + Math.round((e.feitos / e.total) * 100) + '%"></i></div>'
    : "";
  return '<div class="etapa ' + e.estado + '"><span class="marcador"></span>' +
    '<span class="texto">' + esc(e.titulo) + (e.detalhe ? " · " + esc(e.detalhe) : "") + "</span>" +
    direita + "</div>" + barra;
}

function cartaoAprovacao(a) {
  return '<div class="aprovacao"><p>' + esc(a.pergunta) + "</p>" +
    (a.detalhe ? '<p class="num">' + esc(a.detalhe) + "</p>" : "") +
    '<div class="acoes"><button class="aprovar-secundario">Revisar</button>' +
    '<button class="primario">Aprovar</button></div></div>';
}

function desenharAtividade(itens) {
  const alvo = $("atividade");
  if (!itens || !itens.length) {
    alvo.innerHTML = '<span class="vazio-lista" style="padding-left:0">nada ainda</span>';
    return;
  }
  alvo.innerHTML = itens.slice(0, 5).map((a) =>
    '<div class="atividade-linha"><span class="ponto-at"></span><span class="txt">' +
    esc(a.texto) + '<div class="num">' + quando(a.em) + "</div></span></div>"
  ).join("");
}

function quando(iso) {
  const seg = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (seg < 5) return "agora";
  if (seg < 60) return "há " + seg + " s";
  if (seg < 3600) return "há " + Math.floor(seg / 60) + " min";
  return "há " + Math.floor(seg / 3600) + " h";
}

function rolar() { $("fluxo").scrollTop = $("fluxo").scrollHeight; }

/* ------------------------------------------------------------ enviar */

async function enviar() {
  if (estado.ocupado) return;
  const pedido = $("pedido").value.trim();
  if (!pedido) return;

  if (!estado.trabalhoId) {
    const r = await fetch("/api/trabalhos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pedido: pedido }),
    });
    const t = await r.json();
    estado.trabalhoId = t.id;
    estado.trabalho = t;
    $("centro").innerHTML = "";
    $("apagar").hidden = false;
  }

  estado.ocupado = true;
  $("enviar").disabled = true;
  $("pedido").value = "";
  $("pedido").style.height = "auto";
  atualizarSelo(true);

  const centro = $("centro");
  centro.insertAdjacentHTML("beforeend", bolhaPessoa(pedido));
  atualizarPostura();

  const plano = document.createElement("div");
  plano.innerHTML = cartaoPlano(
    [{ titulo: "Procurar nos contratos", estado: "executando", feitos: 0, total: 0, detalhe: "" },
     { titulo: "Ler os trechos e responder", estado: "na_fila", feitos: 0, total: 0, detalhe: "" }], 1);
  centro.appendChild(plano);

  const resposta = document.createElement("div");
  resposta.className = "resposta";
  resposta.innerHTML = '<div class="texto"></div>';
  centro.appendChild(resposta);
  const texto = resposta.querySelector(".texto");
  rolar();

  const inicio = Date.now();
  const relogio = setInterval(() => {
    const c = $("cronometro");
    if (c) c.textContent = Math.round((Date.now() - inicio) / 1000) + " s";
  }, 1000);

  try {
    const r = await fetch("/api/trabalhos/" + estado.trabalhoId + "/perguntar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pergunta: pedido }),
    });
    if (!r.ok) throw new Error("não consegui responder");

    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let buffer = "", primeiro = true;

    while (true) {
      const passo = await leitor.read();
      if (passo.done) break;
      buffer += dec.decode(passo.value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop();

      for (const parte of partes) {
        const mt = parte.match(/^event: (.+)$/m);
        const md = parte.match(/^data: (.*)$/m);
        if (!mt || !md) continue;
        const dados = JSON.parse(md[1]);

        if (mt[1] === "fontes") {
          if (dados.ignorados.length) {
            resposta.insertAdjacentHTML("afterbegin", avisoCobertura(dados));
          }
          resposta.insertAdjacentHTML("beforeend", blocoFontes(dados.trechos, dados));
        } else if (mt[1] === "etapas") {
          plano.innerHTML = cartaoPlano(dados.etapas, 2);
        } else if (mt[1] === "token") {
          if (primeiro) { texto.textContent = ""; primeiro = false; }
          texto.textContent += dados.t;
          rolar();
        } else if (mt[1] === "vazio") {
          texto.textContent = dados.mensagem;
        } else if (mt[1] === "erro") {
          plano.innerHTML = '<div class="aprovacao"><p><strong>Não consegui terminar.</strong> ' +
            esc(dados.mensagem) + '</p><div class="acoes"><button class="primario" onclick="location.reload()">Tentar de novo</button></div></div>';
        } else if (mt[1] === "fim") {
          plano.remove();
          resposta.insertAdjacentHTML("beforeend",
            '<div class="assinatura">respondido em ' + dados.segundos + "s</div>");
          $("conversa-titulo").textContent = dados.titulo;
        }
      }
    }
  } catch (err) {
    texto.textContent = "Não consegui responder: " + err;
  } finally {
    clearInterval(relogio);
    estado.ocupado = false;
    $("enviar").disabled = false;
    atualizarSelo(false);
    carregarTrabalhos();
    if (estado.trabalhoId) {
      fetch("/api/trabalhos/" + estado.trabalhoId)
        .then((r) => r.json())
        .then((t) => { estado.trabalho = t; desenharAtividade(t.atividade); });
    }
    rolar();
    $("pedido").focus();
  }
}

$("enviar").onclick = enviar;
$("pedido").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$("pedido").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px";
});

function atualizarSelo(trabalhando) {
  const selo = $("selo");
  selo.classList.toggle("frio", !trabalhando);
  $("selo-texto").textContent = trabalhando ? "Processando localmente" : "Ocioso";
}

async function carregarStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    estado.contratos = s.contratos;
    $("conversa-meta").textContent = s.contratos
      ? s.contratos + " contrato(s) abertos · " + s.trechos + " trechos"
      : "nenhum contrato aberto";
    if (!s.ollama) {
      $("privacidade").textContent = "o assistente local não respondeu — verifique se o Ollama está aberto";
    }
    if ($("conversa-col").classList.contains("vazia")) desenharExemplosRapidos();
  } catch (err) { /* servidor caiu; o selo ja mostra ocioso */ }
}

async function carregarModelo() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("modelo-tamanho").textContent = s.tamanho_gb
      ? s.tamanho_gb.toString().replace(".", ",") + " GB · na sua máquina"
      : "na sua máquina";
  } catch (err) { /* mantem o texto padrao */ }
}

async function carregarRecursos() {
  try {
    const m = await (await fetch("/api/recursos")).json();
    $("frase-maquina").textContent = m.frase;

    medidor("cpu", m.processador.percentual, m.processador.percentual + "%");
    medidor("memoria", m.memoria.percentual, m.memoria.usado_gb.toString().replace(".", ",") + " GB");

    if (m.video.disponivel && m.video.percentual !== null) {
      medidor("video", m.video.percentual, m.video.percentual + "%");
      $("v-video").title = "medido há " + m.video.segundos_atras + " s";
    } else if (m.video.disponivel) {
      $("v-video").textContent = "medindo";
    } else {
      $("v-video").textContent = "sem leitura";
      $("m-video").style.width = "0%";
    }

    $("devagar").classList.toggle("on", m.devagar);
    $("devagar").setAttribute("aria-checked", m.devagar ? "true" : "false");
  } catch (err) { /* sem leitura agora; tenta de novo no proximo ciclo */ }
}

function medidor(qual, pct, texto) {
  $("m-" + qual).style.width = Math.min(100, Math.max(0, pct)) + "%";
  $("v-" + qual).textContent = texto;
}

$("devagar").onclick = async () => {
  const ligado = !$("devagar").classList.contains("on");
  $("devagar").classList.toggle("on", ligado);
  $("devagar").setAttribute("aria-checked", ligado ? "true" : "false");
  await fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ devagar: ligado }),
  });
};
$("devagar").onkeydown = (e) => {

};

$("abrir-gaveta").onclick = () => $("lateral").classList.toggle("aberta");

/* --------------------------------------------------------- biblioteca */

const bib = { documentos: [], filtro: "" };

async function mostrarBiblioteca() {
  estado.trabalhoId = null;
  estado.trabalho = null;
  $("conversa-titulo").textContent = "Biblioteca";
  $("apagar").hidden = true;
  desenharAtividade([]);
  carregarTrabalhos();

  const centro = $("centro");
  centro.innerHTML = '<div class="catalogo"><p class="nota">carregando…</p></div>';

  let d;
  try {
    d = await (await fetch("/api/biblioteca")).json();
  } catch (err) {
    centro.innerHTML = '<div class="catalogo"><p class="nota">não consegui abrir: ' +
      esc(String(err)) + "</p></div>";
    return;
  }

  bib.documentos = d.documentos;
  bib.pasta = d.pasta;
  bib.totalBytes = d.total_bytes;
  bib.totalTrechos = d.total_trechos;

  $("conversa-meta").textContent = d.documentos.length
    ? d.documentos.length + " documento(s) · " + d.total_trechos + " trechos"
    : "nenhum documento aberto";

  centro.innerHTML =
    '<div class="catalogo"><div class="bib-topo">' +
    "<div><h2>Biblioteca</h2>" +
    '<div class="nota">' + (d.documentos.length
      ? d.documentos.length + " documento(s), " + tamanho(d.total_bytes) +
        ", guardados em " + esc(d.pasta)
      : "Nada aberto ainda. Use Anexar, ali embaixo, ou arraste arquivos para a conversa.") +
    "</div></div>" +
    (d.documentos.length
      ? '<input type="text" class="bib-busca" id="bib-filtro" placeholder="Filtrar por nome, tipo ou cliente…">'
      : "") +
    '</div><div id="bib-lista"></div></div>';

  atualizarPostura();
  if (d.documentos.length) {
    $("bib-filtro").oninput = (e) => { bib.filtro = e.target.value.trim().toLowerCase(); desenharBiblioteca(); };
    desenharBiblioteca();
  }
  $("fluxo").scrollTop = 0;
}

function tamanho(bytes) {
  if (!bytes) return "0 KB";
  if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + " KB";
  return (bytes / 1024 / 1024).toFixed(1).replace(".", ",") + " MB";
}

function desenharBiblioteca() {
  const termo = bib.filtro;
  const lista = bib.documentos.filter((x) =>
    !termo ||
    x.nome.toLowerCase().includes(termo) ||
    (x.tipo_rotulo || "").toLowerCase().includes(termo) ||
    (x.cliente || "").toLowerCase().includes(termo)
  );

  const alvo = $("bib-lista");
  if (!lista.length) {
    alvo.innerHTML = '<p class="nota">Nenhum documento com esse filtro.</p>';
    return;
  }

  alvo.innerHTML = lista.map((x) => {
    const ext = (x.nome.split(".").pop() || "?").slice(0, 4);
    const partes = [];
    if (x.paginas) partes.push(x.paginas + " pág.");
    partes.push(tamanho(x.bytes));
    partes.push(x.trechos + " trecho(s)");
    if (x.aberto_em) partes.push("aberto em " + x.aberto_em);

    let etiquetas = "";
    if (x.tipo_rotulo) etiquetas += '<span class="etiqueta tipo">' + esc(x.tipo_rotulo) + "</span>";
    if (x.cliente) etiquetas += '<span class="etiqueta">' + esc(x.cliente) + "</span>";
    if (x.data) etiquetas += '<span class="etiqueta">' + esc(x.data) + "</span>";
    if (x.valor) etiquetas += '<span class="etiqueta">' + esc(x.valor) + "</span>";
    if (!etiquetas) etiquetas = '<span class="etiqueta">ainda não classificado</span>';

    return '<div class="doc-linha' + (x.existe ? "" : " sumido") + '" data-sha="' + esc(x.sha1) + '">' +
      '<span class="doc-marca">' + esc(ext) + "</span>" +
      '<span class="doc-texto"><div class="doc-nome">' + esc(x.nome) + "</div>" +
      '<div class="doc-meta">' + esc(partes.join(" · ")) +
      (x.existe ? "" : " · arquivo não está mais no disco") + "</div>" +
      '<div class="doc-etiquetas">' + etiquetas + "</div></span>" +
      '<span class="doc-acoes">' +
      '<button data-a="pasta" data-pasta="' + esc(x.pasta) + '">Ver a pasta</button>' +
      '<button data-a="remover">Remover</button></span></div>';
  }).join("");

  alvo.querySelectorAll(".doc-linha").forEach((linha) => {
    const sha = linha.dataset.sha;
    const doc = bib.documentos.find((x) => x.sha1 === sha);
    linha.querySelector('[data-a="pasta"]').onclick = async (e) => {
      await fetch("/api/biblioteca/abrir-pasta", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ caminho: e.target.dataset.pasta }),
      });
    };
    linha.querySelector('[data-a="remover"]').onclick = () => removerDaBiblioteca(doc, linha);
  });
}

async function removerDaBiblioteca(doc, linha) {
  const aviso = "Tirar " + doc.nome + " da biblioteca?\n\n" +
    "Apaga a cópia que o PAULUS guarda. O arquivo original de onde ele veio não é tocado.";
  if (!confirm(aviso)) return;

  const botao = linha.querySelector('[data-a="remover"]');
  botao.disabled = true;
  try {
    const r = await fetch("/api/biblioteca/remover", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sha1: doc.sha1 }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || "falhou");
    bib.documentos = bib.documentos.filter((x) => x.sha1 !== doc.sha1);
    desenharBiblioteca();
    carregarStatus();
    mostrarBiblioteca();
  } catch (err) {
    botao.disabled = false;
    alert("Não consegui remover: " + err);
  }
}

$("ver-biblioteca").onclick = mostrarBiblioteca;

};

function iconeHab(id) {
  const desenho = ICONES_HAB[id] || ICONES_HAB.abrir;
  return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + desenho + "</svg>";
