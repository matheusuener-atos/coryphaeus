<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Paulus — Entrar</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/paulus-logo.png">
<link rel="stylesheet" href="/fontes.css">
<script>
  // O tema antes da primeira pintura: o que a pessoa escolheu neste aparelho
  // (o mesmo do Paulus) ou, sem escolha, o escuro do desenho.
  (function () {
    var tema = "escuro";
    try {
      var g = localStorage.getItem("paulus.tema");
      if (g === "claro" || g === "escuro") tema = g;
    } catch (e) { /* sem memoria do navegador */ }
    document.documentElement.dataset.tema = tema;
  })();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<!--
  A tela de entrar de quem esta de fora (acesso-remoto/v0, R2), no desenho
  "Mobile - Escritorio online" (02/10/2026) e nos passos `Codigo` e `Chave de
  recuperacao` do pacote "Paulus - Telas Mobile".

  1. Sem campo de escritorio (03/10): quem chega aqui ja esta no endereco
     dele (uener.paulus.ia.br); escolher o escritorio e em paulus.ia.br/escritorio.
  2. "Entrar com Atos" (09/10/2026: a Conta Atos e a unica entrada; o Google
     e a senha ficam em atos.dev.br), travado ate a verificacao contra robos
     (Turnstile) passar. O widget da Cloudflare fica escondido
     ("interaction-only": so aparece se pedir um toque) e o estado vai para um
     selo proprio (Verificando, Sucesso, Tente de novo) - o guia "Escritorio
     online". A Atos volta direto a este escritorio e leva ao codigo.
  3. O codigo de 6 digitos do app autenticador - ou, sem o celular, a chave de
     recuperacao XXXX-XXXX, que vale uma vez. "Confiar neste navegador por 30
     dias" pula o codigo nas proximas entradas.

  Pagina propria, e nao uma tela do app: sem sessao, nenhuma rota do app
  responde. Fontes e icones sao os do programa (a politica de seguranca da
  pagina so deixa carregar dela mesma e do Turnstile).
-->
<style>
[data-tema="escuro"] { --bg:#131312; --fill:#222220; --fill2:#2a2a27; --ink:#f2f1ec; --ink2:#a8a69e; --ink3:#95938a;
    --apagado:#6f6e68; --fio:rgba(242,241,236,.12); --fio2:rgba(242,241,236,.1); --fio-forte:rgba(242,241,236,.4); --borda-btn:rgba(242,241,236,.14);
    --erro:#f0a08e; --ok:#8fc9a0; --marca:#8a8982; --marca-sub:#6f6e68; --pastilha-sobre:#303030; --pastilha-ativa:#333330; --fio-sobre:rgba(242,241,236,.2); --cartao-fundo:#161616; --campo-fundo:#111111; --botao-fundo:#1a1a1a; --botao-sobre:#212121; --primario-fundo:#262626; --primario-sobre:#2e2e2e; color-scheme:dark; }
  [data-tema="claro"] { --bg:#f6f5f1; --fill:#e8e7e1; --fill2:#e2e1db; --ink:#1c1c1a; --ink2:#55544f; --ink3:#77766f;
    --apagado:#9a9a93; --fio:rgba(28,28,26,.12); --fio2:rgba(28,28,26,.1); --fio-forte:rgba(28,28,26,.4); --borda-btn:rgba(28,28,26,.14);
    --erro:#a3331f; --ok:#2f6b45; --marca:#8a8a86; --marca-sub:#a8a69e; --pastilha-sobre:#dad9d2; --pastilha-ativa:#d3d2ca; --fio-sobre:rgba(28,28,26,.2); --cartao-fundo:#efeee9; --campo-fundo:#faf9f6; --botao-fundo:#f6f5f1; --botao-sobre:#ecebe6; --primario-fundo:#e2e1db; --primario-sobre:#dad9d2; color-scheme:light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { height: 100vh; height: 100dvh; display: flex; justify-content: center; background: var(--bg); color: var(--ink);
    font: 400 14px/1.5 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .tela { width: 100%; max-width: 440px; height: 100%; display: flex; flex-direction: column; overflow-y: auto;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .mono { font-family: 'Fira Code', ui-monospace, monospace; }
  .serif { font-family: 'Manrope', system-ui, sans-serif; }
  button { font: inherit; }
  [hidden] { display: none !important; }
  .atos-ic { display: block; width: 22px; height: 22px; }
  [data-tema="claro"] .atos-ic { filter: invert(1); }

  /* --- 1. o escritorio e o jeito de entrar */
  /* A marca tem lugar fixo em todas as telas de entrada (02/10): o alto dela
     a 22% da altura da janela, medidos do topo. O formulario vem depois e
     cresce para baixo - trocar de tela nao a tira do lugar. No celular, o
     formulario fica no pe; no computador, logo abaixo da marca. */
  .marca { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 18px; padding: 22vh 32px 32px; padding-top: 22dvh; text-align: center; }
  /* O alto de toda tela de entrar (03/10): "Paulus est\u00e1 te esperando." na serifa, claro, e a frase
     do banco embaixo (js/entrada-saudacao.js) - o jeito da saudacao do assistente: o bloco nasce
     apagado e aparece devagar; ao trocar de passo, a frase sai e a nova entra. PAVLVS e a marca;
     Paulus, o agente. */
  .marca h1 { margin: 0; font: 400 40px/1.08 'EB Garamond', Georgia, serif; letter-spacing: -.015em; color: var(--ink); text-wrap: balance; }
  .marca p { margin: 0; max-width: 360px; font: 400 16px/1.6 'Manrope', sans-serif; color: var(--ink2); text-wrap: pretty; }
  .marca > * { transition: opacity .7s ease, transform .7s ease; }
  .marca.abrindo > * { opacity: 0; }
  .marca.saindo > p { opacity: 0; transform: translateY(4px); }
  @media (prefers-reduced-motion: reduce) { .marca > * { transition: none; } }
  .baixo { flex: none; display: grid; gap: 14px; padding: 0 20px 28px; margin-top: auto; }
  .rotulo { font: 400 12px 'Fira Code', monospace; letter-spacing: .18em; color: var(--apagado); }
  .escritorio { display: grid; gap: 6px; }
  .escritorio label { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px;
    background: var(--campo-fundo); border: 1px solid var(--fio); cursor: text; }
  .escritorio label:focus-within { border-color: var(--fio-forte); }
  .escritorio input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; outline: none;
    font: 400 14px 'Fira Code', monospace; color: var(--ink); }
  /* A linha-botao (padronizacao de 08/10/2026): a mesma de css/57-linha-botao.css, copiada aqui
     porque esta pagina abre sem sessao e so carrega o proprio <style>. */
  .linha-botao { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; height: 56px; padding: 0 14px; margin: 0;
    border: 1px solid var(--fio); border-radius: 12px; background: var(--botao-fundo); color: var(--ink);
    font: 400 14px/1.3 'Manrope', system-ui, sans-serif; text-align: left; text-decoration: none; cursor: pointer;
    transition: background .15s, border-color .15s; }
  div.linha-botao { cursor: default; }
  .linha-botao.duas { height: 64px; }
  .linha-botao.centro { justify-content: center; }
  .linha-botao.centro .lb-texto { flex: 0 1 auto; }
  :is(button, a).linha-botao:hover:not(:disabled) { background: var(--botao-sobre); border-color: var(--fio-sobre); }
  .linha-botao:focus-visible { outline: 2px solid var(--ink3); outline-offset: 2px; }
  .linha-botao:disabled { opacity: .5; cursor: default; }
  .lb-icones { display: flex; align-items: center; gap: 6px; flex: none; }
  .lb-ic { display: grid; place-items: center; width: 32px; height: 32px; flex: none; }
  .lb-ic > :is(img, svg) { display: block; width: 20px; height: 20px; object-fit: contain; }
  .lb-ic.lb-22 > :is(img, svg) { width: 22px; height: 22px; }
  .lb-texto { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .lb-titulo { font: 500 14px/1.3 'Manrope', system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-sub { font: 400 12px/1.3 'Manrope', system-ui, sans-serif; opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-fim { flex: none; white-space: nowrap; }
  .lb-acao { border: 0; background: none; padding: 10px 0; font: 400 13px 'Manrope', system-ui, sans-serif; color: var(--ink2); cursor: pointer; }
  button.lb-acao:hover { color: var(--ink); }
  /* O botao de moldura dupla (Continuar, Entrar): o trilho com a pastilha dentro (guia de 02/10). */
  .g-trilho { display: flex; width: 100%; padding: 1px; border-radius: 12px; background: var(--cartao-fundo); border: 1px solid var(--fio2);
    cursor: pointer; position: relative; }
  .g-trilho::after { content: ""; position: absolute; inset: -2px 0; } /* 44 px de toque */
  .g-pastilha { flex: 1; height: 28px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px;
    background: var(--primario-fundo); color: var(--ink); font: 500 13px 'Manrope', system-ui, sans-serif; letter-spacing: .01em; }
  .g-trilho:active .g-pastilha { background: var(--pastilha-ativa); }
  .g-trilho:focus-visible { outline: 2px solid var(--ink3); outline-offset: 2px; }
  .g-trilho:disabled { opacity: .5; pointer-events: none; }
  /* O widget da Cloudflare nao aparece: so se pedir interacao (appearance
     "interaction-only"), e ai ele surge aqui sozinho. */
  .robo:empty { display: none; }
  .robo { display: flex; justify-content: center; }
  /* O selo proprio, no lugar do widget: verificando, sucesso ou de novo. */
  .cf-badge { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 14px; border-radius: 12px;
    background: var(--cartao-fundo); border: 1px solid var(--fio2); }
  .cf-esq { display: flex; align-items: center; gap: 10px; font: 500 13px 'Manrope', system-ui, sans-serif; color: var(--ink); }
  .cf-icone { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none;
    transition: background .24s, transform .24s cubic-bezier(.2,.8,.2,1); }
  .cf-icone svg { width: 15px; height: 15px; fill: #fff; opacity: 0; transition: opacity .2s .12s; }
  .cf-dir { display: grid; justify-items: end; gap: 2px; text-align: right; }
  .cf-marca { font: 700 12px 'Manrope', system-ui, sans-serif; letter-spacing: .12em; color: var(--ink); }
  .cf-links { font: 400 12px 'Manrope', system-ui, sans-serif; color: var(--ink3); }
  .cf-links a { color: inherit; text-decoration: none; }
  .cf-badge[data-estado="verificando"] .cf-icone { border: 2px solid var(--fio); border-top-color: var(--ink); animation: cf-gira .9s linear infinite; }
  .cf-badge[data-estado="ok"] .cf-icone { background: #2f9e5b; animation: cf-surge .24s cubic-bezier(.2,.8,.2,1); }
  .cf-badge[data-estado="erro"] { cursor: pointer; }
  .cf-badge[data-estado="erro"] .cf-icone { background: #b84a3c; }
  .cf-badge:is([data-estado="ok"], [data-estado="erro"]) .cf-icone svg { opacity: 1; }
  .cf-badge .cf-x { display: none; }
  .cf-badge[data-estado="erro"] .cf-x { display: block; }
  .cf-badge[data-estado="erro"] .cf-v { display: none; }
  @keyframes cf-gira { to { transform: rotate(360deg); } }
  @keyframes cf-surge { from { transform: scale(.6); } to { transform: scale(1); } }
  .link-senha { justify-self: center; border: 0; background: none; padding: 10px 0; color: var(--ink3); font: 500 13px 'Manrope', sans-serif; cursor: pointer; }
  .campos { display: grid; gap: 10px; }
  .campos input { width: 100%; height: 36px; padding: 0 12px; border-radius: 12px; background: var(--campo-fundo); border: 1px solid var(--fio);
    outline: none; color: var(--ink); font: 400 16px 'Manrope', sans-serif; }
  .campos input:focus { border-color: var(--fio-forte); }
  .campos input::placeholder { color: var(--ink3); }
  .ajuda { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink3); text-wrap: pretty; text-align: center; }
  .erro { margin: 0; font-size: 13px; line-height: 1.5; color: var(--erro); text-align: center; }
  .erro:empty { display: none; }
  .ajuda:empty { display: none; }
  /* Erro de campo e borda, nao texto (regra de 08/10/2026): vermelho o que nao fecha, verde o que fecha. */
  .campos input.campo-erro, .campos input.campo-erro:focus, .casas.campo input.campo-erro { border-color: var(--erro); }
  .campos input.campo-ok, .campos input.campo-ok:focus, .casas.campo input.campo-ok { border-color: var(--ok); }
  .campos input.campo-erro:focus { box-shadow: 0 0 0 2px var(--fio); }
  .casas:has(input.campo-erro) span { border-color: var(--erro); }
  .casas:has(input.campo-ok) span { border-color: var(--ok); }
  .campos input, .casas span { transition: border-color .15s ease; }
  @media (prefers-reduced-motion: reduce) { .campos input, .casas span { transition: none; } }
  .so-leitor { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; white-space: nowrap; clip: rect(0 0 0 0); clip-path: inset(50%); }

  /* --- 2. o codigo (e a chave de recuperacao), no desenho "Codigo" */
  .passo { position: relative; max-width: none; overflow: visible; }
  .ligacoes { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .ligacoes .link-senha { padding: 10px 0; }
  .voltar { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0;
    border: 0; background: none; color: var(--ink3); font: 500 13px 'Manrope', sans-serif; cursor: pointer; }
  .voltar:hover, .link-senha:hover { color: var(--ink); }
  .voltar svg { width: 18px; height: 18px; }
  .voltar:hover { color: var(--ink); }
  .rotulo-linha { display: flex; justify-content: space-between; align-items: baseline; }
  .renova { font: 400 12px 'Fira Code', monospace; color: var(--apagado); }
  .renova b { font-weight: 400; color: var(--ink3); }
  .casas { position: relative; display: grid; grid-template-columns: repeat(var(--n, 6), 1fr); gap: 8px; }
  .casas span { height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px;
    background: var(--campo-fundo); border: 1px solid var(--fio); font: 400 20px 'Fira Code', monospace; color: var(--ink); }
  .casas span.vez { border-color: var(--fio-forte); }
  /* O campo de verdade fica por cima das casas, transparente: o teclado do
     celular, o colar e o preenchimento do codigo pelo SMS funcionam. */
  .casas input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; font-size: 16px;
    color: transparent; caret-color: transparent; background: none; }
  .confiar { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--botao-fundo);
    border: 1px solid var(--fio2); cursor: pointer; font: 400 13px 'Manrope', sans-serif; color: var(--ink); }
  .confiar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .confiar i { width: 16px; height: 16px; flex: none; border-radius: 4px; background: var(--fill2); border: 1px solid var(--fio-forte);
    display: flex; align-items: center; justify-content: center; }
  .confiar i svg { width: 13px; height: 13px; fill: var(--ink); opacity: 0; }
  .confiar input:checked + i svg { opacity: 1; }
  .confiar input:focus-visible + i { outline: 2px solid var(--ink3); outline-offset: 2px; }
  .link-senha:hover { color: var(--ink); }
  /* A chave de recuperacao (desenho "Chave de recuperacao"): um campo so,
     com a borda acesa, e a ajuda embaixo. */
  .casas.campo { display: block; }
  .casas.campo span { display: none; }
  .casas.campo input { position: static; display: block; width: 100%; height: 40px; padding: 0 12px; opacity: 1; border-radius: 12px;
    background: var(--campo-fundo); border: 1px solid var(--fio-forte); outline: none; color: var(--ink); caret-color: var(--ink);
    font: 400 15px 'Fira Code', monospace; letter-spacing: .14em; text-transform: uppercase; }
  .ajuda-chave { font: 400 12px/1.5 'Manrope', sans-serif; color: var(--apagado); text-wrap: pretty; }

  /* --- no computador: uma coluna de 360 px no meio da tela, a marca em
     cima (56 px) e o formulario 40 px abaixo - o desenho "Escritorio online"
     de mesa. No celular, a marca no meio e o formulario embaixo. */
  @media (min-width: 601px) {
    .tela { max-width: none; }
    .passo { justify-content: flex-start; align-items: center; gap: 40px; padding: 0 24px 48px; }
    .passo .marca { flex: none; min-height: 0; gap: 14px; padding: calc(22vh - 56px) 0 0; padding-top: calc(22dvh - 56px); }
    .passo .baixo { margin-top: 0; }
    .passo .marca h1 { font-size: 40px; }
    .passo .baixo { width: 100%; max-width: 360px; padding: 0; }
    .g-trilho:hover .g-pastilha { background: var(--primario-sobre); }
    .g-trilho:active .g-pastilha { background: var(--pastilha-ativa); }
  }

  /* A topbar do site (56 px, marca de 20 px, fio embaixo), em toda tela de entrar. */
  .topo { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 28px;
    background: var(--bg); border-bottom: 1px solid var(--fio2); }
  .topo-marca { font: 400 20px/1 'EB Garamond', Georgia, serif; letter-spacing: .12em; color: var(--ink); text-decoration: none; }
  .topo-tema { width: 32px; height: 32px; margin-right: -8px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--ink3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .topo-tema:hover { color: var(--ink); }
  .topo-tema svg { width: 18px; height: 18px; }
  body { padding-top: 56px; }
  .marca { padding-top: calc(22vh - 56px); padding-top: calc(22dvh - 56px); }
  @media (max-width: 600px) { .topo { padding: 0 16px; } }
</style>
</head>
<body>
<header class="topo"><a class="topo-marca" href="https://paulus.ia.br">PAVLVS</a><button type="button" class="topo-tema" id="topo-tema" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5 1.5 3h-3L12 2Zm0 20-1.5-3h3L12 22Zm10-10-3 1.5v-3L22 12ZM2 12l3-1.5v3L2 12Zm17.07-7.07-1.06 3.18-2.12-2.12 3.18-1.06ZM4.93 19.07l1.06-3.18 2.12 2.12-3.18 1.06Zm14.14 0-3.18-1.06 2.12-2.12 1.06 3.18ZM4.93 4.93l3.18 1.06-2.12 2.12-1.06-3.18Z"/></svg></button></header>
<script>(function(){var b=document.getElementById("topo-tema");if(!b)return;b.onclick=function(){var h=document.documentElement;h.dataset.tema=h.dataset.tema==="claro"?"escuro":"claro";try{localStorage.setItem("paulus.tema.entrar",h.dataset.tema);}catch(e){}};try{var t=localStorage.getItem("paulus.tema.entrar");if(t)document.documentElement.dataset.tema=t;}catch(e){}})();</script>
<div class="tela">

  <!-- 1. Entrar com Atos -->
  <section id="entrar-senha" class="tela passo">
    <div class="marca abrindo" id="marca-entrar">
      <h1 data-es-titulo>O que faremos juntos hoje?</h1>
      <p data-es-frase>O mesmo escritório, de onde você estiver.</p>
    </div>
    <form id="form-senha" class="baixo" autocomplete="on" novalidate>
      <button type="button" class="linha-botao centro" id="atos" disabled><span class="lb-icones"><span class="lb-ic"><img class="atos-ic" src="/img/conta-atos.png" alt="" width="22" height="22"></span></span><span class="lb-texto"><b class="lb-titulo">Entrar com Atos</b></span></button>
      <div class="robo" id="robo" aria-label="Verificação contra robôs"></div>
      <div class="cf-badge" id="cf-badge" data-estado="verificando" role="status" aria-live="polite">
        <span class="cf-esq"><span class="cf-icone"><svg class="cf-v" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.55 18-5.7-5.7 1.43-1.42 4.27 4.27 9.17-9.18 1.43 1.43Z"/></svg><svg class="cf-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 19 5 17.6 10.6 12 5 6.4 6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4Z"/></svg></span><span class="cf-texto" id="cf-texto">Verificando…</span></span>
        <span class="cf-dir"><span class="cf-marca">CLOUDFLARE</span><span class="cf-links"><a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener">Privacidade</a> · <a href="https://developers.cloudflare.com/turnstile/" target="_blank" rel="noopener">Ajuda</a></span></span>
      </div>
      <p class="erro" id="erro-senha" role="alert"></p>
    </form>
  </section>

  <!-- 2. O codigo do app autenticador, ou a chave de recuperacao -->
  <section id="entrar-codigo" class="tela passo" hidden>
    <div class="marca abrindo" id="marca-codigo">
      <h1 data-es-titulo>Paulus está te esperando.</h1>
      <p data-es-frase id="quem-titulo">Falta confirmar que é você: digite o código do Google Authenticator.</p>
    </div>
    <form id="form-codigo" class="baixo" autocomplete="off" novalidate>
      <div class="escritorio">
        <span class="rotulo">CONTA</span>
        <div class="linha-botao"><span class="lb-icones"><span class="lb-ic" id="quem-marca"><img class="atos-ic" src="/img/conta-atos.png" alt="" width="22" height="22"></span></span><span class="lb-texto"><b class="lb-titulo" id="quem-email"></b></span><button type="button" class="lb-fim lb-acao" id="trocar">Trocar</button></div>
      </div>
      <div class="escritorio">
        <div class="rotulo-linha"><span class="rotulo" id="rotulo-codigo">GOOGLE AUTHENTICATOR</span><span class="renova" id="renova">renova em <b id="segundos">00:30</b></span></div>
        <div class="casas" id="casas">
          <input id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Código de 6 dígitos" required>
        </div>
        <span class="ajuda-chave" id="ajuda-chave" hidden>Cada chave vale uma vez.</span>
      </div>
      <label class="confiar" id="caixa-confiar"><input type="checkbox" id="confiar"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9.55 18-5.7-5.7 1.43-1.42 4.27 4.27 9.17-9.18 1.43 1.43Z"/></svg></i><span>Confiar neste navegador por 30 dias</span></label>
      <p class="erro" id="erro-codigo" role="alert"></p>
      <button type="submit" class="g-trilho" id="entrar"><span class="g-pastilha" id="entrar-texto">Entrar</span></button>
      <div class="ligacoes"><button type="button" class="voltar" id="voltar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m7.83 13 5.6 5.6L12 20l-8-8 8-8 1.43 1.4-5.6 5.6H20v2Z"/></svg>Voltar</button><button type="button" class="link-senha" id="recuperacao">Não tenho um código</button></div>
    </form>
  </section>
</div>

<script src="/js/entrada-saudacao.js"></script>
<script>
(function () {
  "use strict";
  let pendente = "";
  let robo = null;
  let chaveRobo = "";
  let porRecuperacao = false;
  const $ = (id) => document.getElementById(id);

  /* Erro de campo e borda, nao texto (regra de 08/10/2026, a mesma do Paulus,
     js/00-base.js): vermelho o que nao fecha, verde o que fecha - so depois de
     tocado -, aria-invalid e a frase num .so-leitor (aria-describedby). O erro
     que nao e de campo (robo, limite, servidor) continua no #erro-senha. */
  function marcar(campo, estado, frase) {
    if (!campo) return;
    campo.classList.toggle("campo-erro", estado === "erro");
    campo.classList.toggle("campo-ok", estado === "ok");
    const id = campo.id + "-sr";
    let sr = document.getElementById(id);
    if (estado === "erro") {
      campo.setAttribute("aria-invalid", "true");
      if (!sr) {
        sr = document.createElement("span");
        sr.id = id;
        sr.className = "so-leitor";
        sr.setAttribute("aria-live", "polite");
        (campo.closest(".casas") || campo).insertAdjacentElement("afterend", sr);
      }
      sr.textContent = frase ? frase.charAt(0).toUpperCase() + frase.slice(1) : "";
      campo.setAttribute("aria-describedby", id);
    } else {
      campo.removeAttribute("aria-invalid");
      campo.removeAttribute("aria-describedby");
      if (sr) sr.remove();
    }
  }
  const regras = new Map();
  const tocados = new Set();
  function pintar(campo) {
    const regra = regras.get(campo);
    if (!regra) return "";
    const p = regra(campo.value);
    marcar(campo, p ? "erro" : "ok", p);
    return p;
  }
  function vigiar(campo, regra) {
    regras.set(campo, regra);
    campo.addEventListener("blur", () => { if (campo.value.trim() || tocados.has(campo)) { tocados.add(campo); pintar(campo); } });
    campo.addEventListener("input", () => {
      if (!tocados.has(campo)) return;
      if (regra(campo.value) && !campo.classList.contains("campo-erro")) marcar(campo, "");
      else pintar(campo);
    });
  }
  // Tentou enviar: todos os campos da lista ficam com o estado, e o primeiro que nao fecha ganha o foco.
  function conferir(ids) {
    let primeiro = null;
    ids.map($).forEach((c) => { tocados.add(c); if (pintar(c) && !primeiro) primeiro = c; });
    if (primeiro) primeiro.focus();
    return !primeiro;
  }
  function errado(ids, frase) {
    ids.map($).forEach((c) => { tocados.add(c); marcar(c, "erro", frase); });
    const p = $(ids[0]);
    if (p) p.focus();
  }
  vigiar($("codigo"), (v) => (porRecuperacao ? (/^[0-9A-Z]{4}-?[0-9A-Z]{4}$/i.test(v.trim()) ? "" : "a chave tem 8 letras e números")
    : (/^\d{6}$/.test(v.trim()) ? "" : "o código tem 6 números")));
  // O erro do servidor que e de campo: quais campos ficam vermelhos (lista vazia = nao e de campo).
  function camposDoErro(msg) {
    const m = String(msg || "");
    if (/código/.test(m) && /não confere|venceu/.test(m)) return ["codigo"];
    if (/chave/.test(m) && /não confere|inválid/.test(m)) return ["codigo"];
    return [];
  }
  function mostrarErro(err, onde) {
    const campos = camposDoErro(err.message).filter((id) => $(id) && !$(id).closest("[hidden]"));
    if (campos.length) { $(onde).textContent = ""; errado(campos, err.message); return; }
    $(onde).textContent = err.message;
  }

  // O selo da verificacao contra robos, no lugar do widget da Cloudflare.
  function selo(estado, texto) {
    $("cf-badge").dataset.estado = estado;
    $("cf-texto").textContent = texto;
    $("atos").disabled = estado !== "ok";
  }
  $("cf-badge").addEventListener("click", (e) => {
    if ($("cf-badge").dataset.estado !== "erro" || e.target.closest("a")) return;
    selo("verificando", "Verificando…");
    novoRobo();
  });

  // "Paulus está te esperando." e a frase de cada passo (js/entrada-saudacao.js).
  function saudar(bloco, tela) {
    if (!window.EntradaSaudacao || !bloco) { if (bloco) bloco.classList.remove("abrindo"); return; }
    if (bloco.dataset.aberto) EntradaSaudacao.trocar(bloco, tela);
    else { bloco.dataset.aberto = "1"; EntradaSaudacao.abrir(bloco, tela); }
  }

  function passo(qual) {
    $("entrar-senha").hidden = qual !== "entrar";
    $("entrar-codigo").hidden = qual !== "codigo";
    if (qual === "entrar") saudar($("marca-entrar"), "entrar");
    else saudar($("marca-codigo"), porRecuperacao ? "chave" : "codigo");
    if (qual === "codigo") { desenharCasas(); $("codigo").focus(); }
  }

  function mostrarRobo(chave) {
    chaveRobo = chave;
    if (!chave) { selo("erro", "Indisponível"); $("erro-senha").textContent = "o acesso externo deste escritório não terminou de ser configurado"; return; }
    const tentar = () => {
      if (!window.turnstile) { setTimeout(tentar, 200); return; }
      // "interaction-only": o widget so aparece se a Cloudflare pedir um
      // toque; o estado vai para o selo.
      robo = window.turnstile.render("#robo", { sitekey: chave, language: "pt-br", size: "flexible", appearance: "interaction-only",
        theme: document.documentElement.dataset.tema === "escuro" ? "dark" : "light",
        callback: () => selo("ok", "Sucesso!"),
        "error-callback": () => selo("erro", "Tente de novo"),
        "expired-callback": () => { selo("verificando", "Verificando…"); novoRobo(); } });
      // Um token que ja veio pronto (o navegador ja verificado) conta igual.
      setTimeout(() => { if (tokenDoRobo() && $("cf-badge").dataset.estado !== "ok") selo("ok", "Sucesso!"); }, 300);
    };
    tentar();
  }

  async function enviar(url, corpo) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    let dados = {};
    try { dados = await r.json(); } catch (e) { /* resposta sem corpo */ }
    if (!r.ok) throw new Error(dados.detail || "não deu certo, tente de novo");
    return dados;
  }
  const tokenDoRobo = () => (robo !== null && window.turnstile ? window.turnstile.getResponse(robo) : "");
  const novoRobo = () => { if (robo !== null && window.turnstile) window.turnstile.reset(robo); };

  // As casas do codigo: o campo de verdade fica por cima, transparente.
  function desenharCasas() {
    const n = porRecuperacao ? 8 : 6;
    const v = $("codigo").value.replace(porRecuperacao ? /[^0-9a-z]/gi : /\D/g, "").toUpperCase().slice(0, n);
    const casas = $("casas");
    casas.querySelectorAll("span").forEach((s) => s.remove());
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.textContent = v[i] || "";
      if (i === Math.min(v.length, n - 1) && document.activeElement === $("codigo")) s.classList.add("vez");
      casas.insertBefore(s, $("codigo"));
    }
  }
  $("codigo").addEventListener("input", desenharCasas);
  $("codigo").addEventListener("focus", desenharCasas);
  $("codigo").addEventListener("blur", desenharCasas);

  // "Renova em 00:18": o codigo do autenticador vale 30 s.
  function relogio() {
    const s = 30 - (Math.floor(Date.now() / 1000) % 30);
    if ($("segundos")) $("segundos").textContent = "00:" + String(s).padStart(2, "0");
  }
  relogio();
  setInterval(relogio, 1000);

  // A volta da Atos vem depois do # (nao sai do navegador): #g=<pendencia>&e=<e-mail>
  // leva ao codigo; #entrou e o navegador confiado (a sessao ja esta aberta);
  // #erro=<frase> diz o que nao fechou.
  const volta = new URLSearchParams(location.hash.slice(1));
  if (volta.has("entrou")) { location.replace("/"); return; }
  if (volta.get("g") || volta.get("erro")) history.replaceState(null, "", location.pathname);
  if (volta.get("erro")) $("erro-senha").textContent = volta.get("erro");
  if (volta.get("g")) {
    pendente = volta.get("g");
    // A conta que voltou da Atos fica lembrada neste aparelho: na proxima
    // entrada ela vai como dica (o e-mail ja vem preenchido la).
    if (volta.get("e")) { try { localStorage.setItem("paulus.atos.email", volta.get("e")); } catch (e) { /* sem memoria */ } }
    $("quem-email").textContent = volta.get("e") || "sua Conta Atos";
    passo("codigo");
  } else {
    passo("entrar");
  }

  async function entrarComAtos() {
    const b = $("atos");
    b.disabled = true; $("erro-senha").textContent = "";
    try {
      const token = tokenDoRobo();
      if (!token) throw new Error("confirme a verificação contra robôs acima");
      let dica = "";
      try { dica = localStorage.getItem("paulus.atos.email") || ""; } catch (e) { /* sem memoria */ }
      const d = await enviar("/api/acesso/atos/iniciar", { finalidade: "entrar", turnstile: token, dica });
      location.assign(d.url);
      return;
    } catch (err) { $("erro-senha").textContent = err.message; }
    // Cada token vale uma vez: o selo volta a verificar e destrava sozinho.
    selo("verificando", "Verificando…");
    novoRobo();
  }
  $("atos").addEventListener("click", () => entrarComAtos());
  $("form-senha").addEventListener("submit", (e) => { e.preventDefault(); entrarComAtos(); });

  fetch("/api/acesso/entrar/config").then((r) => r.json()).then((d) => {
    mostrarRobo(d.turnstile_sitekey);
  }).catch(() => { $("erro-senha").textContent = "não consegui abrir a tela de entrar; recarregue a página"; });

  $("form-codigo").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = $("entrar");
    b.disabled = true; $("erro-codigo").textContent = "";
    if (!conferir(["codigo"])) { b.disabled = false; return; }
    let codigo = $("codigo").value.trim().toUpperCase();
    // A chave de recuperacao e XXXX-XXXX; digitada sem o hifen, ele entra aqui.
    if (porRecuperacao && /^[0-9A-Z]{8}$/.test(codigo)) codigo = codigo.slice(0, 4) + "-" + codigo.slice(4);
    try {
      await enviar("/api/acesso/entrar/codigo", { pendente, codigo, confiar: $("confiar").checked });
      location.replace("/");
    } catch (err) { mostrarErro(err, "erro-codigo"); b.disabled = false; }
  });

  // Sem o celular: a chave de recuperacao (`Chave de recuperacao`), XXXX-XXXX,
  // letras e numeros, uma vez cada.
  $("recuperacao").addEventListener("click", () => {
    porRecuperacao = !porRecuperacao;
    const c = $("codigo");
    c.value = "";
    c.maxLength = porRecuperacao ? 9 : 6;
    c.inputMode = porRecuperacao ? "text" : "numeric";
    c.setAttribute("aria-label", porRecuperacao ? "Chave de recuperação de 8 caracteres" : "Código de 6 dígitos");
    saudar($("marca-codigo"), porRecuperacao ? "chave" : "codigo");
    $("rotulo-codigo").textContent = porRecuperacao ? "CHAVE DE RECUPERAÇÃO" : "GOOGLE AUTHENTICATOR";
    $("renova").textContent = porRecuperacao ? "uso único" : "renova em ";
    if (!porRecuperacao) { const b = document.createElement("b"); b.id = "segundos"; $("renova").appendChild(b); relogio(); }
    $("casas").classList.toggle("campo", porRecuperacao);
    $("ajuda-chave").hidden = !porRecuperacao;
    $("trocar").hidden = porRecuperacao;
    $("caixa-confiar").hidden = porRecuperacao;
    if (porRecuperacao) $("confiar").checked = false;
    c.autocomplete = porRecuperacao ? "off" : "one-time-code";
    $("recuperacao").textContent = porRecuperacao ? "Usar o Google Authenticator" : "Não tenho um código";
    $("entrar-texto").textContent = "Entrar";
    $("erro-codigo").textContent = "";
    marcar(c, "");
    tocados.delete(c);
    desenharCasas();
    c.focus();
  });

  $("trocar").addEventListener("click", () => $("voltar").click());
  $("voltar").addEventListener("click", () => {
    pendente = ""; $("codigo").value = ""; $("erro-codigo").textContent = "";
    passo("entrar");
  });
})();
</script>
</body>
</html>
