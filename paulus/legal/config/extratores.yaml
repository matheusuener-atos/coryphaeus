# Quem extrai o que, e com qual modelo.
#
# Trocar de especialista e mudar uma linha aqui - nao ha codigo a alterar.
# Trocar o extrator de uma secao marca SO AQUELA SECAO como velha em todo o
# acervo, e ela e reprocessada sozinha; o resto do metadata fica.
#
# A ordem manda: para cada secao vale o extrator de MENOR nivel. Regra antes
# de modelo, sempre - o que uma expressao regular acerta sempre e de graca nao
# deve passar por um modelo de tres bilhoes de parametros.
#
#   nivel 0   regra deterministica
#   nivel 1   modelo pequeno
#   nivel 2   modelo grande
#   nivel 3   verificador (confere o que os niveis 1 e 2 disseram)

modelos:
  # Nesta maquina ha um modelo so instalado, e os tres perfis apontam para ele.
  # A separacao existe para o dia em que houver dois: a ingestao roda em
  # segundo plano e pode usar o melhor; a consulta responde agora e usa o
  # menor. Temperatura zero e semente fixa em todos: sem determinismo, duas
  # execucoes produzem metadata diferente e nao ha como saber se uma troca de
  # modelo melhorou ou piorou.
  roteador:
    id: llama3.2:3b
    runtime: ollama
    temperature: 0
    seed: 42
    num_ctx: 8192
  pequeno:
    id: llama3.2:3b
    runtime: ollama
    temperature: 0
    seed: 42
    num_ctx: 8192
  grande:
    id: llama3.2:3b
    runtime: ollama
    temperature: 0
    seed: 42
    num_ctx: 8192

extratores:
  # -------------------------------------------------------------- nivel 0
  case-number-rules/v1:
    secao: case
    nivel: 0
    modulo: regras_processo
  date-parser/v1:
    secao: dates
    nivel: 0
    modulo: regras_datas
  amount-parser/v1:
    secao: amounts
    nivel: 0
    modulo: regras_valores
  lawref-rules/v1:
    secao: legal_references
    nivel: 0
    modulo: regras_leis

  # ------------------------------------------------- nivel 0 (mais regras)
  jurisdiction-rules/v1:
    secao: jurisdiction
    nivel: 0
    modulo: regras_juizo

  # ------------------------------------ nivel 0 (colecoes de extensao)
  # Passo 7 da spec. Cada colecao e um extrator independente e uma linha
  # aqui - o esquema nao muda, o acervo nao migra, e desligar uma colecao e
  # apagar a linha dela. Todas sao de regra: o que estas frases tem em comum
  # e serem escritas com verbo proprio, e verbo proprio uma expressao regular
  # acha sempre.
  request-rules/v1:
    secao: requests
    nivel: 0
    modulo: regras_pedidos
  decision-rules/v1:
    secao: decisions
    nivel: 0
    modulo: regras_decisoes
  event-rules/v1:
    secao: events
    nivel: 0
    modulo: regras_eventos

  # -------------------------------------------------------------- nivel 1
  # Regra primeiro, modelo no residuo: o tipo do documento sai do vocabulario
  # do cabecalho, e o modelo so e chamado quando a regra nao decide. Por isso
  # `exige_modelo: false` - com o assistente desligado a secao continua
  # existindo, com o que a regra achou.
  doc-classifier/v1:
    secao: classification
    nivel: 1
    modulo: llm_classificador
    modelo: pequeno
    exige_modelo: false
    prompt_version: classification/v1

  # -------------------------------------------------------------- nivel 2
  # Estas precisam do modelo mesmo: quem e autor e quem e reu depende de ler a
  # frase. Sem assistente ligado a secao fica `missing` e o roteador escala.
  party-extractor/v2:
    secao: parties
    nivel: 2
    modulo: llm_partes
    modelo: grande
    exige_modelo: true
    prompt_version: parties/v2
  summarizer/v1:
    secao: summary
    nivel: 2
    modulo: llm_resumo
    modelo: grande
    exige_modelo: true
    prompt_version: summary/v1

  # -------------------------------------------------------------- nivel 3
  # O conferidor le a afirmacao e o trecho citado e diz se um sustenta o
  # outro. Nunca e o mesmo modelo na mesma chamada do extrator: auto-
  # verificacao nao verifica nada.
  span-verifier/v1:
    papel: verifier
    nivel: 3
    modulo: verificador
    modelo: pequeno
    prompt_version: verifier/v1
