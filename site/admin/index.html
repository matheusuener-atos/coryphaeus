<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração — PAVLVS</title>
<meta name="description" content="Administração do PAVLVS: contas, túneis, planos, notas fiscais e a fila de alterações.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#131312">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../assets/paulus-logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pv-tema')==='claro'?'light':'dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Manrope:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..400,0..1,0&icon_names=account_balance_wallet,add,add_link,arrow_back,arrow_downward,arrow_forward,arrow_outward,arrow_upward,autorenew,block,calendar_month,campaign,check,chevron_left,chevron_right,close,code,contacts,content_copy,dark_mode,dashboard,delete,devices,dns,download,edit,expand_less,expand_more,group,history,keyboard_return,lan,light_mode,link_off,list,local_offer,lock,logout,mail,menu,menu_book,more_horiz,north_west,notifications,pause_circle,payments,person_add,picture_as_pdf,play_circle,print,publish,receipt_long,refresh,remove,search,send,shield,swap_horiz,sync,token,touch_app,tune,undo,upload,warning&display=block">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/paginas.css">
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body class="adm">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<!-- Antes da sessao: as duas portas (Cloudflare Access e GitHub) -->
<div id="entrada" class="entrada-adm" hidden style="flex:1;display:flex;flex-direction:column">
  <header class="topo">
    <a class="marca" href="../" aria-label="PAVLVS — página inicial">PAVLVS</a>
    <div class="acoes">
      <button type="button" class="btn-icone" data-alternar-tema aria-label="Alternar tema"><span class="icon" aria-hidden="true">light_mode</span></button>
    </div>
  </header>
  <main class="entrada" style="flex:1">
    <div class="entrada-col" id="entrada-col"><p class="carregando" style="text-align:center">Conferindo a sessão…</p></div>
  </main>
</div>

<!-- Depois da sessao: a casca do painel -->
<div id="casca" hidden style="flex:1;display:flex;align-items:stretch">
  <nav class="adm-trilho" aria-label="Painel">
    <div class="adm-faixa">
      <a class="adm-t-marca" href="#visao" aria-label="PAVLVS · Administração, visão geral"><span class="p">P</span><span class="adm-t-rot">AVLVS<span class="rotulo">Admin</span></span></a>
      <button type="button" class="adm-t-item" id="abrir-busca" aria-label="Buscar em tudo" aria-haspopup="dialog"><span class="icon" aria-hidden="true">search</span><span class="adm-t-rot">Buscar em tudo</span></button>
      <div class="adm-t-lista" id="nav-lateral"></div>
      <span class="adm-t-vazio"></span>
      <span class="adm-t-risco"></span>
      <button type="button" class="adm-t-item adm-t-conta" id="adm-conta" data-a="contaMenu" aria-label="Minha conta" aria-haspopup="dialog"><span class="cad-avatar" id="adm-avatar"></span><span class="adm-t-rot" id="adm-avatar-nome">Minha conta</span></button>
      <button type="button" class="adm-t-item" data-alternar-tema aria-label="Alternar tema"><span class="icon" aria-hidden="true">light_mode</span><span class="adm-t-rot">Tema</span></button>
      <button type="button" class="adm-t-item" data-a="sair"><span class="icon" aria-hidden="true">logout</span><span class="adm-t-rot">Sair</span></button>
    </div>
  </nav>
  <div class="adm-corpo">
    <nav class="adm-pilulas" id="nav-celular" aria-label="Telas do painel"></nav>
    <main id="conteudo" class="adm-main" tabindex="-1">
      <div class="adm-col" id="tela"></div>
    </main>
  </div>
</div>

<!-- gaveta, modal e busca -->
<div id="camada"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="../assets/site.js" defer></script>
<script src="../assets/cnpj.js" defer></script>
<script src="../assets/admin.js" defer></script>
</body>
</html>
